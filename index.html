<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scribble Notepad — Foldable</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scribble">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%230a0f1a'/%3E%3Crect x='80' y='72' width='352' height='368' rx='20' fill='%23f3dfb4'/%3E%3Cpath d='M130 300 Q 170 230 210 300 T 290 300 T 370 250' fill='none' stroke='%232b1a0e' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #1b2740 0%, #0a0f1a 60%) fixed;
    color:#e6edf7;
    display:flex;flex-direction:column;height:100%;
    overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  .toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;
    background:rgba(17,24,39,.85);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.08);
    z-index:10;
  }
  .group{display:flex;align-items:center;gap:6px}
  .spacer{flex:1 1 auto}
  .divider{width:1px;height:24px;background:rgba(255,255,255,.12);margin:0 4px}

  button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
  .tool,.icon{
    width:38px;height:38px;display:grid;place-items:center;
    border-radius:10px;color:#aebbd0;
    transition:background .15s,color .15s,transform .1s;
  }
  .tool:hover,.icon:hover{background:rgba(255,255,255,.08);color:#fff}
  .tool:active,.icon:active{transform:scale(.94)}
  .tool.active{background:#2563eb;color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.45)}
  .icon:disabled{opacity:.3;cursor:not-allowed;background:transparent}
  svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .layout-btn{
    height:34px;padding:0 10px;border-radius:8px;
    background:rgba(255,255,255,.08);
    color:#aebbd0;font-size:11.5px;font-weight:600;
    display:flex;align-items:center;gap:6px;
    letter-spacing:.3px;white-space:nowrap;
    transition:background .15s,color .15s;
  }
  .layout-btn:hover{background:rgba(255,255,255,.14);color:#fff}
  .layout-btn .dot{width:8px;height:8px;border-radius:50%;background:#8b9bb4}
  .layout-btn[data-mode="one"],
  .layout-btn[data-mode="two"]{background:rgba(37,99,235,.20);color:#93c5fd}
  .layout-btn[data-mode="one"] .dot{background:#60a5fa}
  .layout-btn[data-mode="two"] .dot{background:#60a5fd;box-shadow:0 0 0 3px rgba(96,165,250,.25)}

  #installBtn{background:rgba(34,197,94,.15);color:#86efac;display:none}
  #installBtn:hover{background:rgba(34,197,94,.25);color:#bbf7d0}
  #installBtn .dot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}

  .colors{gap:5px}
  .swatch{
    width:24px;height:24px;border-radius:50%;
    background:var(--c);
    border:2px solid rgba(255,255,255,.22);
    padding:0;
    transition:transform .12s,border-color .12s;
  }
  .swatch:hover{transform:scale(1.12)}
  .swatch.active{border-color:#fff;box-shadow:0 0 0 2px rgba(37,99,235,.85)}
  .swatch.custom{
    background:conic-gradient(#ef4444,#f59e0b,#22c55e,#06b6d4,#3b82f6,#a855f7,#ef4444);
    position:relative;overflow:hidden;
  }
  .swatch.custom input{position:absolute;inset:-10px;opacity:0;cursor:pointer;width:200%;height:200%}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:96px;height:4px;border-radius:99px;
    background:rgba(255,255,255,.18);outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:#fff;border:0;cursor:pointer;
  }
  .sizeLabel{
    font-variant-numeric:tabular-nums;font-size:12px;color:#8b9bb4;
    min-width:22px;text-align:center;
  }

  .menu{position:relative}
  .primary{
    display:flex;align-items:center;gap:7px;
    background:linear-gradient(180deg,#3b82f6,#2563eb);
    color:#fff;padding:9px 14px;border-radius:10px;
    font-weight:600;font-size:14px;
    box-shadow:0 6px 18px rgba(37,99,235,.35);
    transition:filter .15s,transform .1s;
  }
  .primary:hover{filter:brightness(1.09)}
  .primary:active{transform:scale(.97)}
  .primary svg{width:15px;height:15px}
  .dropdown{
    position:absolute;right:0;top:calc(100% + 8px);
    background:#111827;border:1px solid rgba(255,255,255,.1);
    border-radius:12px;padding:6px;min-width:255px;
    box-shadow:0 20px 40px rgba(0,0,0,.55);
    display:none;flex-direction:column;gap:2px;z-index:50;
  }
  .dropdown.open{display:flex}
  .dropdown button{
    text-align:left;padding:9px 10px;border-radius:8px;
    font-size:14px;color:#dbe4f3;display:flex;align-items:center;gap:9px;width:100%;
  }
  .dropdown button:hover{background:rgba(255,255,255,.08)}
  .dropdown svg{width:16px;height:16px;color:#7f93ad;flex-shrink:0}
  .check{
    display:flex;align-items:center;gap:9px;padding:10px;
    font-size:13px;color:#9fb0c9;cursor:pointer;
    border-top:1px solid rgba(255,255,255,.08);margin-top:4px;
  }
  .check input{accent-color:#2563eb;width:15px;height:15px;cursor:pointer}
  .note{
    font-size:11.5px;color:#6b7c95;padding:6px 10px 4px;
    border-top:1px solid rgba(255,255,255,.08);margin-top:4px;line-height:1.4;
  }

  .stage{
    flex:1;min-height:0;
    display:flex;justify-content:center;
    padding:16px 16px 82px;
    position:relative;
    overflow:hidden;
  }
  body.two-page .stage{padding:12px 12px 78px}

  .book{
    flex:1 1 auto;
    min-width:0;min-height:0;
    max-width:1400px;
    display:flex;
    gap:18px;
    will-change:transform,opacity;
  }
  /* Page turn animations */
  .book.turn-next{
    animation:turnNext .38s cubic-bezier(.4,0,.2,1);
  }
  .book.turn-prev{
    animation:turnPrev .38s cubic-bezier(.4,0,.2,1);
  }
  @keyframes turnNext{
    0%   { transform:translateX(0);    opacity:1; }
    45%  { transform:translateX(-40px); opacity:.35; }
    55%  { transform:translateX(40px);  opacity:.35; }
    100% { transform:translateX(0);    opacity:1; }
  }
  @keyframes turnPrev{
    0%   { transform:translateX(0);    opacity:1; }
    45%  { transform:translateX(40px);  opacity:.35; }
    55%  { transform:translateX(-40px); opacity:.35; }
    100% { transform:translateX(0);    opacity:1; }
  }

  /* Drag feedback while swiping */
  .book.dragging{
    transition:none;
    animation:none;
  }

  .page-wrap{
    flex:1 1 0;
    min-width:0;min-height:0;
    display:none;
  }
  .page-wrap.visible{display:flex}

  .paper{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    padding:24px;
    border-radius:12px;
    background-color:#f2ddb0;
    background-image:
      radial-gradient(circle at 18% 28%, rgba(180,140,80,.16), transparent 42%),
      radial-gradient(circle at 76% 66%, rgba(160,120,60,.13), transparent 46%),
      radial-gradient(circle at 46% 88%, rgba(200,170,110,.14), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(200,170,110,.12), transparent 38%),
      url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.10'/></svg>"),
      linear-gradient(180deg,#f8ebcd 0%,#f3dfb4 55%,#ecd39c 100%);
    box-shadow:
      0 24px 70px rgba(0,0,0,.55),
      0 0 0 1px rgba(120,80,30,.25),
      inset 0 0 60px rgba(140,100,40,.20),
      inset 0 0 14px rgba(120,80,30,.14);
    overflow:hidden;
  }
  body.two-page .page-wrap.spread-left  .paper{
    border-top-right-radius:3px;border-bottom-right-radius:3px;
  }
  body.two-page .page-wrap.spread-right .paper{
    border-top-left-radius:3px;border-bottom-left-radius:3px;
  }

  body.two-page .book{gap:10px}
  body.two-page .paper{padding:16px}
  @media (max-width: 700px){
    body.two-page .stage{padding:8px 8px 76px}
    body.two-page .book{gap:6px}
    body.two-page .paper{padding:10px;border-radius:8px}
  }

  .sheet{
    position:relative;
    flex:1 1 auto;min-width:0;
    border-radius:4px;
    background-image:repeating-linear-gradient(
      to bottom,
      rgba(150,110,55,.30) 0 1px,
      transparent 1px 32px
    );
  }
  .board,.overlay{
    position:absolute;inset:0;
    width:100%;height:100%;
    display:block;
  }
  .board{touch-action:none;cursor:crosshair;z-index:1}
  .overlay{pointer-events:none;z-index:2}

  .pagenum{
    position:absolute;
    right:14px;bottom:10px;
    z-index:3;
    font-size:12px;
    font-variant-numeric:tabular-nums;
    letter-spacing:.5px;
    color:rgba(120,85,40,.55);
    pointer-events:none;
    user-select:none;
  }

  .hint{
    position:absolute;inset:0;z-index:0;
    display:grid;place-items:center;
    color:rgba(140,100,50,.45);font-size:15px;letter-spacing:.3px;
    pointer-events:none;transition:opacity .35s;
    text-align:center;padding:0 20px;
  }
  .hint.hide{opacity:0}
  .hint small{display:block;font-size:12px;margin-top:6px;opacity:.7}

  .pager{
    position:fixed;
    bottom:12px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:4px;
    padding:5px 6px;
    background:rgba(17,24,39,.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:999px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    z-index:20;
  }
  .pager button{
    width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;color:#cbd6e6;
    transition:background .15s,color .15s;
  }
  .pager button:hover{background:rgba(255,255,255,.1)}
  .pager button:disabled{opacity:.3;cursor:not-allowed;background:transparent}
  .pager .label{
    font-size:13px;font-variant-numeric:tabular-nums;
    color:#cbd6e6;min-width:70px;text-align:center;padding:0 4px;
  }
  .pager .sep{width:1px;height:22px;background:rgba(255,255,255,.12);margin:0 3px}
  .pager #addPage{color:#86efac}
  .pager #addPage:hover{background:rgba(34,197,94,.18)}
  .pager #delPage{color:#fca5a5}
  .pager #delPage:hover{background:rgba(239,68,68,.18)}

  .saving{
    position:fixed;
    top:8px;left:50%;transform:translateX(-50%);
    padding:5px 12px;border-radius:999px;
    background:rgba(37,99,235,.92);
    color:#fff;font-size:11.5px;font-weight:600;
    letter-spacing:.3px;z-index:60;
    opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .saving.show{opacity:1}

  .busy{
    position:fixed;inset:0;
    display:none;place-items:center;
    background:rgba(10,15,26,.75);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    z-index:80;
  }
  .busy.show{display:grid}
  .busy .box{
    padding:16px 22px;border-radius:12px;
    background:rgba(17,24,39,.95);
    border:1px solid rgba(255,255,255,.12);
    text-align:center;font-size:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
  }
  .busy .spinner{
    width:26px;height:26px;margin:0 auto 10px;
    border:3px solid rgba(255,255,255,.18);
    border-top-color:#60a5fa;border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to { transform:rotate(360deg); } }

  @media (max-width:640px){
    .toolbar{gap:6px;padding:8px 10px}
    .tool,.icon{width:34px;height:34px}
    input[type=range]{width:70px}
    .stage{padding:10px 10px 78px}
    .paper{padding:14px;border-radius:10px}
    .divider{display:none}
    .book{gap:10px}
    .layout-btn{padding:0 8px;font-size:11px}
    .pager{bottom:8px;gap:2px;padding:4px 5px}
    .pager button{width:32px;height:32px}
    .pager .label{min-width:62px;font-size:12px}
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="group" role="group" aria-label="Drawing tools">
    <button class="tool active" data-tool="pen" title="Pen (P)" aria-label="Pen">
      <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
    </button>
    <button class="tool" data-tool="highlighter" title="Highlighter (H)" aria-label="Highlighter">
      <svg viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
    </button>
    <button class="tool" data-tool="eraser" title="Eraser (E)" aria-label="Eraser">
      <svg viewBox="0 0 24 24"><path d="M20 20H8.5L3.7 15.2a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l5.5 5.5a2 2 0 0 1 0 2.8L11.5 20"/><path d="M7 12l5 5"/></svg>
    </button>
  </div>

  <div class="divider"></div>

  <div class="group">
    <button class="icon" id="insertImg" title="Insert image (I)" aria-label="Insert image">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div class="divider"></div>

  <div class="group colors" id="colors" role="group" aria-label="Colors">
    <button class="swatch active" data-color="#2b1a0e" style="--c:#2b1a0e" aria-label="Ink black"></button>
    <button class="swatch" data-color="#1e3a8a" style="--c:#1e3a8a" aria-label="Blue"></button>
    <button class="swatch" data-color="#8b1a1a" style="--c:#8b1a1a" aria-label="Crimson"></button>
    <button class="swatch" data-color="#1f5e2a" style="--c:#1f5e2a" aria-label="Green"></button>
    <button class="swatch" data-color="#9a6412" style="--c:#9a6412" aria-label="Amber"></button>
    <button class="swatch" data-color="#5b2c83" style="--c:#5b2c83" aria-label="Purple"></button>
    <label class="swatch custom" title="Custom color">
      <input type="color" id="customColor" value="#0ea5e9" aria-label="Custom color">
    </label>
  </div>

  <div class="group">
    <input type="range" id="size" min="1" max="48" value="3" aria-label="Brush size">
    <span class="sizeLabel" id="sizeLabel">3</span>
  </div>

  <div class="spacer"></div>

  <div class="group">
    <button class="layout-btn" id="layoutBtn" data-mode="auto" title="Layout: Auto — tap to cycle (Auto → 1 page → 2 pages)" aria-label="Layout mode">
      <span class="dot"></span>
      <span id="layoutLabel">Auto</span>
    </button>
    <button class="layout-btn" id="installBtn" title="Install as app" aria-label="Install app">
      <span class="dot"></span>
      <span>Install</span>
    </button>
    <button class="icon" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
      <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
    <button class="icon" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>
      <svg viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </button>
    <button class="icon" id="clear" title="Clear page" aria-label="Clear page">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    </button>
  </div>

  <div class="menu" id="menu">
    <button class="primary" id="saveBtn" aria-haspopup="true" aria-expanded="false">
      Save
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="dropdown" id="dropdown">
      <button data-export="png">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Download current view as PNG
      </button>
      <button data-export="pdf">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Download current view as PDF
      </button>
      <button data-export="pdf-all">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="14" x2="15" y2="14"/><line x1="9" y1="18" x2="15" y2="18"/></svg>
        Download ALL pages as PDF
      </button>
      <label class="check">
        <input type="checkbox" id="withLines" checked>
        Include ruled lines
      </label>
      <label class="check" style="border-top:0;margin-top:0;padding-top:0">
        <input type="checkbox" id="withNumbers" checked>
        Include page numbers
      </label>
      <div class="note" id="exportNote">Exports the current view.</div>
    </div>
  </div>
</div>

<div class="stage" id="stage">
  <div class="book" id="book"></div>
</div>

<div class="pager">
  <button id="prevPage" aria-label="Previous page">
    <svg viewBox="0 0 24 24" style="width:18px;height:18px"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="label" id="pageLabel">1 / 2</span>
  <button id="nextPage" aria-label="Next page">
    <svg viewBox="0 0 24 24" style="width:18px;height:18px"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <span class="sep"></span>
  <button id="addPage" title="Add pages" aria-label="Add pages">
    <svg viewBox="0 0 24 24" style="width:18px;height:18px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button id="delPage" title="Delete this page" aria-label="Delete page">
    <svg viewBox="0 0 24 24" style="width:18px;height:18px"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
  </button>
</div>

<div class="saving" id="savingBadge">Saved</div>

<div class="busy" id="busy">
  <div class="box">
    <div class="spinner"></div>
    <div id="busyText">Building PDF…</div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const book       = document.getElementById('book');
  const stage      = document.getElementById('stage');
  const sizeEl     = document.getElementById('size');
  const sizeLbl    = document.getElementById('sizeLabel');
  const undoBtn    = document.getElementById('undo');
  const redoBtn    = document.getElementById('redo');
  const menu       = document.getElementById('menu');
  const dropdown   = document.getElementById('dropdown');
  const saveBtn    = document.getElementById('saveBtn');
  const linesCb    = document.getElementById('withLines');
  const numbersCb  = document.getElementById('withNumbers');
  const fileIn     = document.getElementById('fileInput');
  const exportNote = document.getElementById('exportNote');
  const prevBtn    = document.getElementById('prevPage');
  const nextBtn    = document.getElementById('nextPage');
  const addBtn     = document.getElementById('addPage');
  const delBtn     = document.getElementById('delPage');
  const pageLabel  = document.getElementById('pageLabel');
  const layoutBtn  = document.getElementById('layoutBtn');
  const layoutLbl  = document.getElementById('layoutLabel');
  const savingBadge= document.getElementById('savingBadge');
  const busy       = document.getElementById('busy');
  const busyText   = document.getElementById('busyText');

  const RULED       = 32;
  const HANDLE_SIZE = 11;
  const HANDLE_HIT  = 14;
  const MIN_SIDE    = 30;
  const TWO_PAGE_MQ = '(min-width: 560px)';
  const SWIPE_MIN   = 60;    // px horizontal travel to trigger page turn
  const SWIPE_MAX_Y = 70;    // px vertical tolerance (must be mostly horizontal)

  const toolSizes = { pen: 3, highlighter: 18, eraser: 24 };

  const state = {
    tool: 'pen',
    color: '#2b1a0e',
    size: 3,
    strokes: [],
    redo: [],
    current: null,
    selectedIndex: -1,
    dragMode: null,
    dragStart: null,
    currentPage: 0,
    visiblePages: [0],
    twoPage: false,
    layoutMode: 'auto',
    pageCount: 2,
    loaded: false
  };

  const pages = [];

  /* ============================================================
     IndexedDB persistence
     ============================================================ */
  const DB_NAME = 'scribble-notepad';
  const DB_VERSION = 1;
  const STORE = 'doc';
  const DOC_KEY = 'main';

  let db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return resolve(null);
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function serializeStrokes() {
    const out = [];
    for (const s of state.strokes) {
      if (s.kind === 'image') {
        out.push({
          kind: 'image',
          page: s.page,
          x: s.x, y: s.y, w: s.w, h: s.h,
          aspect: s.aspect,
          src: s.src || ''
        });
      } else {
        out.push({
          kind: 'stroke',
          page: s.page,
          tool: s.tool,
          color: s.color,
          size: s.size,
          points: s.points
        });
      }
    }
    return out;
  }

  async function saveDoc() {
    if (!db) return;
    try {
      const data = {
        version: 1,
        savedAt: Date.now(),
        pageCount: pages.length,
        currentPage: state.currentPage,
        layoutMode: state.layoutMode,
        strokes: serializeStrokes()
      };
      await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(data, DOC_KEY);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      flashSaved();
    } catch (err) {
      console.warn('Save failed:', err);
    }
  }

  async function loadDoc() {
    if (!db) return null;
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).get(DOC_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    } catch (err) {
      console.warn('Load failed:', err);
      return null;
    }
  }

  let saveTimer = null;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDoc, 500);
  }

  let badgeTimer = null;
  function flashSaved() {
    if (!savingBadge) return;
    savingBadge.textContent = 'Saved';
    savingBadge.classList.add('show');
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(() => savingBadge.classList.remove('show'), 900);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) saveDoc();
  });
  window.addEventListener('pagehide', () => saveDoc());
  window.addEventListener('beforeunload', () => { if (db) saveDoc(); });

  /* ============================================================
     Shared ResizeObserver
     ============================================================ */
  const ro = new ResizeObserver((entries) => {
    for (const entry of entries) {
      const pg = entry.target.__pg;
      if (pg) resizePage(pg);
    }
  });

  /* ============================================================
     Page creation
     ============================================================ */
  function makePage() {
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap';

    const paper = document.createElement('div');
    paper.className = 'paper';

    const sheet = document.createElement('div');
    sheet.className = 'sheet';

    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.innerHTML = 'Start scribbling…<small>Drag &amp; drop or paste an image anywhere</small>';

    const board = document.createElement('canvas');
    board.className = 'board';

    const overlay = document.createElement('canvas');
    overlay.className = 'overlay';

    const num = document.createElement('div');
    num.className = 'pagenum';

    sheet.append(hint, board, overlay, num);
    paper.append(sheet);
    wrap.append(paper);

    const pg = {
      index: pages.length,
      wrap, sheet, board, overlay, hint, num,
      ctx: board.getContext('2d'),
      octx: overlay.getContext('2d'),
      dpr: 1
    };

    sheet.__pg = pg;

    board.addEventListener('pointerdown', (e) => onDown(e, pg));
    board.addEventListener('pointermove', (e) => onMove(e, pg));
    board.addEventListener('contextmenu', (e) => e.preventDefault());

    ro.observe(sheet);
    return pg;
  }

  function addPage(navigate = true) {
    const pg = makePage();
    pages.push(pg);
    book.appendChild(pg.wrap);
    renumberPages();

    if (navigate) state.currentPage = pg.index;
    applyLayout();
    scheduleSave();
    return pg;
  }

  function deletePage(index) {
    if (pages.length <= 1) return;
    const pg = pages[index];
    if (!pg) return;

    ro.unobserve(pg.sheet);
    pg.wrap.remove();
    pages.splice(index, 1);

    state.strokes = state.strokes.filter(s => s.page !== index);
    for (const s of state.strokes) if (s.page > index) s.page -= 1;
    state.redo = [];
    state.current = null;

    renumberPages();

    if (state.currentPage >= pages.length) state.currentPage = pages.length - 1;
    if (state.selectedIndex >= state.strokes.length) state.selectedIndex = -1;

    applyLayout();
    redrawAll();
    drawAllOverlays();
    updateHints();
    updateHistoryButtons();
    scheduleSave();
  }

  function renumberPages() {
    pages.forEach((pg, i) => {
      pg.index = i;
      pg.num.textContent = i + 1;
    });
  }

  /* ============================================================
     Sizing
     ============================================================ */
  function resizePage(pg) {
    const r = pg.sheet.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width));
    const h = Math.max(1, Math.round(r.height));
    if (w <= 2 || h <= 2) return;

    pg.dpr = Math.min(window.devicePixelRatio || 1, 2);
    pg.board.width   = Math.round(w * pg.dpr);
    pg.board.height  = Math.round(h * pg.dpr);
    pg.overlay.width = pg.board.width;
    pg.overlay.height= pg.board.height;

    redrawPage(pg);
    drawOverlay(pg);
  }

  /* ============================================================
     Rendering
     ============================================================ */
  function redrawPage(pg) {
    const ctx = pg.ctx, dpr = pg.dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = pg.board.width / dpr;
    const h = pg.board.height / dpr;
    ctx.clearRect(-2, -2, w + 4, h + 4);

    for (const s of state.strokes) {
      if (s.page !== pg.index) continue;
      if (s.kind === 'image') {
        try { ctx.drawImage(s.img, s.x, s.y, s.w, s.h); } catch (_) {}
      } else {
        drawStroke(ctx, s);
      }
    }
    if (state.current && state.current.page === pg.index) {
      drawStroke(ctx, state.current);
    }
  }

  function redrawAll() { pages.forEach(redrawPage); }

  function applyStyle(ctx, s) {
    ctx.globalCompositeOperation = s.tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.globalAlpha = s.tool === 'highlighter' ? 0.32 : 1;
    ctx.strokeStyle = s.color;
    ctx.fillStyle   = s.color;
    ctx.lineWidth   = s.size;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
  }

  function drawStroke(ctx, s) {
    const p = s.points;
    if (!p.length) return;

    ctx.save();
    applyStyle(ctx, s);

    if (p.length === 1) {
      ctx.beginPath();
      ctx.arc(p[0].x, p[0].y, Math.max(s.size / 2, 0.5), 0, Math.PI * 2);
      ctx.fill();
    } else {
      let prev = p[0], prevMid = p[0];
      for (let i = 1; i < p.length; i++) {
        const cur = p[i];
        const mx = (prev.x + cur.x) / 2;
        const my = (prev.y + cur.y) / 2;
        ctx.beginPath();
        ctx.moveTo(prevMid.x, prevMid.y);
        ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
        ctx.stroke();
        prev = cur;
        prevMid = { x: mx, y: my };
      }
      ctx.beginPath();
      ctx.moveTo(prevMid.x, prevMid.y);
      ctx.lineTo(prev.x, prev.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLiveTail(ctx, s) {
    const p = s.points;
    const i = p.length - 1;
    const prev = p[i - 1], cur = p[i];
    const prevMid = i >= 2
      ? { x: (p[i - 2].x + p[i - 1].x) / 2, y: (p[i - 2].y + p[i - 1].y) / 2 }
      : p[0];
    const mx = (prev.x + cur.x) / 2;
    const my = (prev.y + cur.y) / 2;

    ctx.save();
    applyStyle(ctx, s);
    ctx.beginPath();
    ctx.moveTo(prevMid.x, prevMid.y);
    ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
    ctx.stroke();
    ctx.restore();
  }

  /* ============================================================
     Selection overlay
     ============================================================ */
  function getHandles(s) {
    return {
      nw: { x: s.x,        y: s.y },
      ne: { x: s.x + s.w,  y: s.y },
      sw: { x: s.x,        y: s.y + s.h },
      se: { x: s.x + s.w,  y: s.y + s.h }
    };
  }

  function drawOverlay(pg) {
    const octx = pg.octx, dpr = pg.dpr;
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = pg.board.width / dpr;
    const h = pg.board.height / dpr;
    octx.clearRect(-2, -2, w + 4, h + 4);

    const s = state.selectedIndex >= 0 ? state.strokes[state.selectedIndex] : null;
    if (!s || s.kind !== 'image' || s.page !== pg.index) return;

    octx.strokeStyle = '#2563eb';
    octx.lineWidth = 1.5;
    octx.setLineDash([6, 4]);
    octx.strokeRect(s.x + 0.5, s.y + 0.5, Math.max(0, s.w - 1), Math.max(0, s.h - 1));
    octx.setLineDash([]);

    const hs = HANDLE_SIZE;
    for (const p of Object.values(getHandles(s))) {
      octx.fillStyle = '#ffffff';
      octx.strokeStyle = '#2563eb';
      octx.lineWidth = 2;
      octx.beginPath();
      octx.rect(p.x - hs / 2, p.y - hs / 2, hs, hs);
      octx.fill();
      octx.stroke();
    }
  }

  function drawAllOverlays() { pages.forEach(drawOverlay); }

  /* ============================================================
     Hit testing
     ============================================================ */
  function pointFrom(e, pg) {
    const r = pg.board.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function hitTestHandles(p, pg) {
    if (state.selectedIndex < 0) return null;
    const s = state.strokes[state.selectedIndex];
    if (!s || s.kind !== 'image' || s.page !== pg.index) return null;

    for (const [name, hp] of Object.entries(getHandles(s))) {
      if (Math.hypot(p.x - hp.x, p.y - hp.y) <= HANDLE_HIT) {
        return { handle: name, element: s };
      }
    }
    return null;
  }

  function hitTestImages(p, pageIndex) {
    for (let i = state.strokes.length - 1; i >= 0; i--) {
      const s = state.strokes[i];
      if (s.kind !== 'image' || s.page !== pageIndex) continue;
      if (p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h) {
        return { element: s, index: i };
      }
    }
    return null;
  }

  /* ============================================================
     Cursor feedback
     ============================================================ */
  function updateCursor(p, pg) {
    const sel = state.selectedIndex >= 0 ? state.strokes[state.selectedIndex] : null;
    if (sel && sel.kind === 'image' && sel.page === pg.index) {
      for (const [name, hp] of Object.entries(getHandles(sel))) {
        if (Math.hypot(p.x - hp.x, p.y - hp.y) <= HANDLE_HIT) {
          pg.board.style.cursor =
            (name === 'nw' || name === 'se') ? 'nwse-resize' : 'nesw-resize';
          return;
        }
      }
    }
    pg.board.style.cursor = hitTestImages(p, pg.index) ? 'move'
                          : (state.tool === 'eraser' ? 'cell' : 'crosshair');
  }

  /* ============================================================
     Pointer handlers
     ============================================================ */
  function onDown(e, pg) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();

    if (state.currentPage !== pg.index) {
      state.currentPage = pg.index;
      updatePager();
      updateExportNote();
      scheduleSave();
    }

    try { pg.board.setPointerCapture(e.pointerId); } catch (_) {}

    const p = pointFrom(e, pg);

    const handleHit = hitTestHandles(p, pg);
    if (handleHit) { startResize(handleHit.handle, handleHit.element, p); return; }

    const imgHit = hitTestImages(p, pg.index);
    if (imgHit) {
      if (state.selectedIndex !== imgHit.index) {
        state.selectedIndex = imgHit.index;
        drawAllOverlays();
      }
      startMove(imgHit.element, p);
      return;
    }

    if (state.selectedIndex >= 0) {
      state.selectedIndex = -1;
      drawAllOverlays();
    }

    state.redo.length = 0;
    updateHistoryButtons();

    state.current = {
      kind: 'stroke',
      page: pg.index,
      tool: state.tool,
      color: state.color,
      size: state.size,
      points: [p]
    };
    drawStroke(pg.ctx, state.current);
    pg.hint.classList.add('hide');
  }

  function onMove(e, pg) {
    const p = pointFrom(e, pg);

    if (!state.current && !state.dragMode) {
      if (e.pointerType === 'mouse') updateCursor(p, pg);
      return;
    }

    if (state.current && state.current.page !== pg.index) return;
    if (state.dragMode && state.selectedIndex >= 0) {
      const sel = state.strokes[state.selectedIndex];
      if (sel && sel.page !== pg.index) return;
    }

    e.preventDefault();

    if (state.dragMode) { handleDrag(p); return; }

    const s = state.current;
    if (!s) return;

    const raw = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : [];
    const events = raw.length ? raw : [e];

    for (const ev of events) {
      const pt = pointFrom(ev, pg);
      const last = s.points[s.points.length - 1];
      const dx = pt.x - last.x, dy = pt.y - last.y;
      if (dx * dx + dy * dy < 1) continue;
      s.points.push(pt);
      drawLiveTail(pg.ctx, s);
    }
  }

  function finishAny() {
    if (state.dragMode) {
      state.dragMode = null;
      state.dragStart = null;
      scheduleSave();
      return;
    }
    if (!state.current) return;

    const pg = pages[state.current.page];
    state.strokes.push(state.current);
    state.current = null;

    if (pg) redrawPage(pg);
    drawAllOverlays();
    updateHistoryButtons();
    updateHints();
    scheduleSave();
  }

  window.addEventListener('pointerup', finishAny);
  window.addEventListener('pointercancel', finishAny);

  /* ============================================================
     Move + resize
     ============================================================ */
  function startMove(s, p) {
    state.dragMode = 'move';
    state.dragStart = { x: s.x, y: s.y, px: p.x, py: p.y };
  }

  function startResize(handle, s, p) {
    let ax, ay;
    if (handle === 'se')      { ax = s.x;       ay = s.y; }
    else if (handle === 'sw') { ax = s.x + s.w; ay = s.y; }
    else if (handle === 'ne') { ax = s.x;       ay = s.y + s.h; }
    else                      { ax = s.x + s.w; ay = s.y + s.h; }

    state.dragMode = 'resize-' + handle;
    state.dragStart = { w: s.w, h: s.h, anchorX: ax, anchorY: ay, aspect: s.aspect };
  }

  function handleDrag(p) {
    const s = state.strokes[state.selectedIndex];
    if (!s || s.kind !== 'image') return;

    if (state.dragMode === 'move') {
      s.x = state.dragStart.x + (p.x - state.dragStart.px);
      s.y = state.dragStart.y + (p.y - state.dragStart.py);
    } else {
      applyResize(s, state.dragMode.slice(7), p);
    }
    const pg = pages[s.page];
    if (pg) { redrawPage(pg); drawOverlay(pg); }
  }

  function applyResize(s, handle, p) {
    const ds = state.dragStart;
    const sx = (handle === 'ne' || handle === 'se') ? 1 : -1;
    const sy = (handle === 'sw' || handle === 'se') ? 1 : -1;

    const dx = sx * ds.aspect, dy = sy;
    const len = Math.hypot(dx, dy);
    const dirX = dx / len, dirY = dy / len;

    const proj = (p.x - ds.anchorX) * dirX + (p.y - ds.anchorY) * dirY;
    const origDiag = Math.hypot(ds.w, ds.h);

    let scale = proj / origDiag;
    const minScale = Math.max(MIN_SIDE / ds.w, MIN_SIDE / ds.h);
    if (!isFinite(scale) || scale < minScale) scale = minScale;

    const newW = ds.w * scale, newH = ds.h * scale;

    if (handle === 'se')      { s.x = ds.anchorX;        s.y = ds.anchorY; }
    else if (handle === 'sw') { s.x = ds.anchorX - newW; s.y = ds.anchorY; }
    else if (handle === 'ne') { s.x = ds.anchorX;        s.y = ds.anchorY - newH; }
    else                      { s.x = ds.anchorX - newW; s.y = ds.anchorY - newH; }

    s.w = newW; s.h = newH;
  }

  /* ============================================================
     History + hints
     ============================================================ */
  function updateHistoryButtons() {
    undoBtn.disabled = state.strokes.length === 0;
    redoBtn.disabled = state.redo.length === 0;
  }

  function updateHints() {
    for (const pg of pages) {
      const has = state.strokes.some(s => s.page === pg.index);
      pg.hint.classList.toggle('hide', has);
    }
  }

  function undo() {
    if (!state.strokes.length) return;
    state.redo.push(state.strokes.pop());
    state.selectedIndex = -1;
    redrawAll(); drawAllOverlays();
    updateHistoryButtons(); updateHints();
    scheduleSave();
  }

  function redo() {
    if (!state.redo.length) return;
    state.strokes.push(state.redo.pop());
    state.selectedIndex = -1;
    redrawAll(); drawAllOverlays();
    updateHistoryButtons(); updateHints();
    scheduleSave();
  }

  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  document.getElementById('clear').addEventListener('click', () => {
    const targets = state.twoPage ? state.visiblePages.slice() : [state.currentPage];
    const has = state.strokes.some(s => targets.includes(s.page));
    if (!has) return;

    const label = targets.length > 1
      ? `pages ${targets[0] + 1}–${targets[targets.length - 1] + 1}`
      : `page ${targets[0] + 1}`;

    if (!confirm(`Clear ${label}? This cannot be undone.`)) return;

    state.strokes = state.strokes.filter(s => !targets.includes(s.page));
    state.redo = [];
    state.current = null;
    state.selectedIndex = -1;
    redrawAll(); drawAllOverlays();
    updateHistoryButtons(); updateHints();
    scheduleSave();
  });

  /* ============================================================
     Tool / color / size UI
     ============================================================ */
  function setTool(t) {
    if (t === state.tool) return;
    toolSizes[state.tool] = state.size;
    state.tool = t;
    state.size = toolSizes[t];
    sizeEl.value = state.size;
    sizeLbl.textContent = state.size;

    document.querySelectorAll('.tool').forEach(b =>
      b.classList.toggle('active', b.dataset.tool === t));
    pages.forEach(pg => {
      pg.board.style.cursor = t === 'eraser' ? 'cell' : 'crosshair';
    });
  }

  document.querySelectorAll('.tool').forEach(btn => {
    btn.addEventListener('click', () => setTool(btn.dataset.tool));
  });

  sizeEl.addEventListener('input', () => {
    state.size = +sizeEl.value;
    toolSizes[state.tool] = state.size;
    sizeLbl.textContent = state.size;
  });

  function setColor(c) {
    state.color = c;
    document.querySelectorAll('.swatch[data-color]').forEach(s =>
      s.classList.toggle('active', s.dataset.color.toLowerCase() === c.toLowerCase()));
    if (state.tool === 'eraser') setTool('pen');
  }

  document.querySelectorAll('.swatch[data-color]').forEach(sw => {
    sw.addEventListener('click', () => setColor(sw.dataset.color));
  });

  document.getElementById('customColor').addEventListener('input', (e) => {
    state.color = e.target.value;
    document.querySelectorAll('.swatch[data-color]').forEach(s => s.classList.remove('active'));
    document.querySelector('.swatch.custom').classList.add('active');
    if (state.tool === 'eraser') setTool('pen');
  });

  /* ============================================================
     Image insertion
     ============================================================ */
  document.getElementById('insertImg').addEventListener('click', () => fileIn.click());

  fileIn.addEventListener('change', () => {
    const f = fileIn.files && fileIn.files[0];
    if (f) loadImageFile(f);
    fileIn.value = '';
  });

  function loadImageFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const img = new Image();
      img.onload = () => insertImage(img, dataUrl);
      img.onerror = () => alert('Could not load that image.');
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  }

  function insertImage(img, dataUrl) {
    const pg = pages[state.currentPage];
    if (!pg) return;

    const sheetW = pg.board.width / pg.dpr;
    const sheetH = pg.board.height / pg.dpr;
    if (sheetW <= 2 || sheetH <= 2) return;

    let w = img.naturalWidth || img.width || 300;
    let h = img.naturalHeight || img.height || 300;

    const maxW = sheetW * 0.6, maxH = sheetH * 0.6;
    const scale = Math.min(1, maxW / w, maxH / h);
    w *= scale; h *= scale;

    const element = {
      kind: 'image',
      page: pg.index,
      img,
      src: dataUrl,
      x: (sheetW - w) / 2,
      y: (sheetH - h) / 2,
      w, h,
      aspect: (img.naturalWidth || w) / (img.naturalHeight || h)
    };

    state.strokes.push(element);
    state.redo.length = 0;
    state.selectedIndex = state.strokes.length - 1;

    redrawPage(pg); drawAllOverlays();
    updateHistoryButtons(); updateHints();
    scheduleSave();
  }

  ['dragenter', 'dragover'].forEach(evt => {
    document.addEventListener(evt, (e) => {
      if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      }
    });
  });

  document.addEventListener('drop', (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) {
      e.preventDefault();
      loadImageFile(f);
    }
  });

  document.addEventListener('paste', (e) => {
    if (!e.clipboardData) return;
    const item = Array.from(e.clipboardData.items || [])
      .find(it => it.type && it.type.startsWith('image/'));
    if (item) {
      e.preventDefault();
      const f = item.getAsFile();
      if (f) loadImageFile(f);
    }
  });

  /* ============================================================
     Swipe-to-turn gesture (touch/pen only)
     ============================================================ */
  const swipe = {
    active: false,
    startX: 0, startY: 0,
    dx: 0, dy: 0,
    pointerId: null,
    startTime: 0
  };

  stage.addEventListener('pointerdown', (e) => {
    // Ignore if the pointer started on an active element
    if (e.pointerType === 'mouse') return;
    if (state.current || state.dragMode) return;   // busy drawing
    swipe.active = true;
    swipe.pointerId = e.pointerId;
    swipe.startX = e.clientX;
    swipe.startY = e.clientY;
    swipe.dx = 0; swipe.dy = 0;
    swipe.startTime = Date.now();
    book.classList.add('dragging');
    book.style.transform = '';
  }, { passive: true });

  stage.addEventListener('pointermove', (e) => {
    if (!swipe.active || e.pointerId !== swipe.pointerId) return;
    swipe.dx = e.clientX - swipe.startX;
    swipe.dy = e.clientY - swipe.startY;

    // If we start drawing instead, cancel the swipe
    if (state.current) {
      swipe.active = false;
      book.classList.remove('dragging');
      book.style.transform = '';
      return;
    }

    // Only respond to mostly horizontal gestures
    if (Math.abs(swipe.dy) > SWIPE_MAX_Y && Math.abs(swipe.dx) < SWIPE_MIN) {
      return;
    }
    // Live drag feedback (resisted, capped)
    const capped = Math.max(-90, Math.min(90, swipe.dx * 0.45));
    book.style.transform = `translateX(${capped}px)`;
  }, { passive: true });

  function endSwipe(e) {
    if (!swipe.active) return;
    if (e && swipe.pointerId !== null && e.pointerId !== swipe.pointerId) return;

    const dx = swipe.dx;
    const dy = swipe.dy;
    const dt = Date.now() - swipe.startTime;
    const velocity = Math.abs(dx) / Math.max(1, dt);   // px per ms

    swipe.active = false;
    swipe.pointerId = null;
    book.classList.remove('dragging');
    book.style.transform = '';

    // Decide direction
    const horizontal = Math.abs(dx) > Math.abs(dy);
    const distanceOK = Math.abs(dx) > SWIPE_MIN;
    const velocityOK = velocity > 0.35 && Math.abs(dx) > 25;
    const verticalOK = Math.abs(dy) < SWIPE_MAX_Y;

    if (!horizontal || !verticalOK || (!distanceOK && !velocityOK)) return;

    if (dx < 0) {
      // Swipe left → next
      if (state.twoPage) {
        const spread = Math.floor(state.currentPage / 2);
        if ((spread + 1) * 2 < pages.length || ((spread + 1) * 2 === pages.length)) {
          // allow landing on last single-page spread if it exists
        }
      }
      if (!nextBtn.disabled) {
        animateTurn('next');
        nextBtn.click();
      }
    } else {
      if (!prevBtn.disabled) {
        animateTurn('prev');
        prevBtn.click();
      }
    }
  }

  stage.addEventListener('pointerup', endSwipe);
  stage.addEventListener('pointercancel', endSwipe);
  stage.addEventListener('pointerleave', (e) => {
    if (swipe.active) endSwipe(e);
  });

  function animateTurn(direction) {
    book.classList.remove('turn-next', 'turn-prev');
    // Force reflow so the animation restarts even if it just played
    void book.offsetWidth;
    book.classList.add(direction === 'next' ? 'turn-next' : 'turn-prev');
    setTimeout(() => {
      book.classList.remove('turn-next', 'turn-prev');
    }, 420);
  }

  /* ============================================================
     Save menu
     ============================================================ */
  saveBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = dropdown.classList.toggle('open');
    saveBtn.setAttribute('aria-expanded', String(open));
  });

  document.addEventListener('pointerdown', (e) => {
    if (!menu.contains(e.target)) {
      dropdown.classList.remove('open');
      saveBtn.setAttribute('aria-expanded', 'false');
    }
  });

  document.querySelectorAll('[data-export]').forEach(btn => {
    btn.addEventListener('click', () => {
      dropdown.classList.remove('open');
      saveBtn.setAttribute('aria-expanded', 'false');
      exportFile(btn.dataset.export);
    });
  });

  /* ============================================================
     Export — single view or all pages
     ============================================================ */
  function addNoise(c, W, H) {
    const TS = 140;
    const tile = document.createElement('canvas');
    tile.width = tile.height = TS;
    const tc = tile.getContext('2d');
    const img = tc.createImageData(TS, TS);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = 118 + Math.random() * 40;
      d[i] = v + 8; d[i + 1] = v; d[i + 2] = v - 12; d[i + 3] = 26;
    }
    tc.putImageData(img, 0, 0);
    const pat = c.createPattern(tile, 'repeat');
    c.save();
    c.fillStyle = pat;
    c.fillRect(0, 0, W, H);
    c.restore();
  }

  function paintParchment(c, W, H, scale, withLines, hCss) {
    const base = c.createLinearGradient(0, 0, 0, H);
    base.addColorStop(0,    '#f8ebcd');
    base.addColorStop(0.55, '#f3dfb4');
    base.addColorStop(1,    '#ecd39c');
    c.fillStyle = base;
    c.fillRect(0, 0, W, H);

    const R = Math.max(W, H);
    const blotch = (rx, ry, rad, rgb, a) => {
      const x = W * rx, y = H * ry, r = R * rad;
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${rgb},${a})`);
      g.addColorStop(1, `rgba(${rgb},0)`);
      c.fillStyle = g;
      c.fillRect(x - r, y - r, r * 2, r * 2);
    };
    blotch(0.18, 0.28, 0.42, '180,140,80', 0.16);
    blotch(0.76, 0.66, 0.46, '160,120,60', 0.13);
    blotch(0.46, 0.88, 0.42, '200,170,110', 0.14);
    blotch(0.88, 0.12, 0.38, '200,170,110', 0.12);

    const vg = c.createRadialGradient(
      W / 2, H / 2, Math.min(W, H) * 0.35,
      W / 2, H / 2, Math.max(W, H) * 0.75
    );
    vg.addColorStop(0, 'rgba(120,80,30,0)');
    vg.addColorStop(1, 'rgba(120,80,30,0.14)');
    c.fillStyle = vg;
    c.fillRect(0, 0, W, H);

    addNoise(c, W, H);

    if (withLines) {
      c.fillStyle = 'rgba(150,110,55,0.30)';
      const t = Math.max(1, Math.round(scale));
      for (let y = 0; y < hCss; y += RULED) {
        c.fillRect(0, Math.round(y * scale), W, t);
      }
    }
  }

  function drawPageNumber(c, W, H, scale, n) {
    const size = Math.max(11, Math.round(13 * scale));
    c.save();
    c.font = `${size}px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    c.fillStyle = 'rgba(120,85,40,0.55)';
    c.textAlign = 'right';
    c.textBaseline = 'bottom';
    c.fillText(String(n), W - 16 * scale, H - 10 * scale);
    c.restore();
  }

  // Render one page onto a canvas and return its JPEG data
  function renderPageToJPEG(pi, withLines, withNumbers, scale) {
    const pg = pages[pi];
    if (!pg) return null;

    const wCss = pg.board.width / pg.dpr;
    const hCss = pg.board.height / pg.dpr;

    const out = document.createElement('canvas');
    out.width  = Math.round(wCss * scale);
    out.height = Math.round(hCss * scale);
    const c = out.getContext('2d');

    paintParchment(c, out.width, out.height, scale, withLines, hCss);

    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = 'high';
    c.drawImage(pg.board, 0, 0, out.width, out.height);

    if (withNumbers) drawPageNumber(c, out.width, out.height, scale, pi + 1);

    const dataUrl = out.toDataURL('image/jpeg', 0.92);
    const jpegBytes = base64ToBytes(dataUrl.split(',')[1]);
    return { bytes: jpegBytes, w: out.width, h: out.height };
  }

  // Compose multiple pages side-by-side onto one canvas (for "current view")
  function compose(pageList, withLines, withNumbers, scale) {
    const pg0  = pages[pageList[0]];
    const wCss = pg0.board.width / pg0.dpr;
    const hCss = pg0.board.height / pg0.dpr;

    const gapCss = pageList.length > 1 ? 20 : 0;
    const outWCss = pageList.length * wCss + gapCss * (pageList.length - 1);

    const out = document.createElement('canvas');
    out.width  = Math.round(outWCss * scale);
    out.height = Math.round(hCss * scale);
    const c = out.getContext('2d');

    c.fillStyle = '#0a0f1a';
    c.fillRect(0, 0, out.width, out.height);

    pageList.forEach((pi, k) => {
      const pg = pages[pi];
      if (!pg) return;

      const W = wCss * scale, H = hCss * scale;
      const offX = (wCss + gapCss) * k;

      c.save();
      c.translate(offX * scale, 0);

      paintParchment(c, W, H, scale, withLines, hCss);

      c.imageSmoothingEnabled = true;
      c.imageSmoothingQuality = 'high';
      c.drawImage(pg.board, 0, 0, W, H);

      if (withNumbers) drawPageNumber(c, W, H, scale, pi + 1);

      c.restore();
    });

    return out;
  }

  function timestamp() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }

  function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  function getExportPages() {
    return state.twoPage ? state.visiblePages.slice() : [state.currentPage];
  }

  function exportFile(type) {
    state.selectedIndex = -1;
    drawAllOverlays();

    const withLines   = linesCb.checked;
    const withNumbers = numbersCb.checked;
    const base = 'note-' + timestamp();

    /* ---------- PDF containing ALL pages ---------- */
    if (type === 'pdf-all') {
      busyText.textContent = 'Building PDF…';
      busy.classList.add('show');

      // Give the browser a frame to paint the busy overlay first
      requestAnimationFrame(() => {
        setTimeout(() => {
          try {
            const scale = 2;
            const jpegPages = [];
            for (let i = 0; i < pages.length; i++) {
              const j = renderPageToJPEG(i, withLines, withNumbers, scale);
              if (j) jpegPages.push(j);
            }
            const blob = buildMultiPagePDF(jpegPages);
            download(blob, base + '-all.pdf');
          } catch (err) {
            console.error(err);
            alert('Could not build the PDF: ' + err.message);
          } finally {
            busy.classList.remove('show');
          }
        }, 40);
      });
      return;
    }

    /* ---------- Single view ---------- */
    const pageList = getExportPages().filter(i => pages[i]);
    if (!pageList.length) return;
    const out = compose(pageList, withLines, withNumbers, 2);

    if (type === 'png') {
      out.toBlob((blob) => { if (blob) download(blob, base + '.png'); }, 'image/png');
      return;
    }

    const dataUrl = out.toDataURL('image/jpeg', 0.92);
    const bytes = base64ToBytes(dataUrl.split(',')[1]);
    download(buildPDF(bytes, out.width, out.height), base + '.pdf');
  }

  function base64ToBytes(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  /* ---------- Single-image PDF (kept for "current view") ---------- */
  function buildPDF(jpegBytes, imgW, imgH) {
    return buildMultiPagePDF([{ bytes: jpegBytes, w: imgW, h: imgH }]);
  }

  /* ---------- Multi-page PDF ----------
     Each page is one JPEG image. We fit each image onto a
     standard page (A4 landscape or portrait, depending on aspect)
     while preserving the image's aspect ratio.
  ---------------------------------------- */
  function buildMultiPagePDF(jpegPages) {
    if (!jpegPages || !jpegPages.length) {
      throw new Error('No pages to export.');
    }

    const enc = new TextEncoder();
    const parts = [];
    let size = 0;
    const add = (d) => {
      const b = (d instanceof Uint8Array) ? d : enc.encode(d);
      parts.push(b); size += b.length;
    };

    // Header (with binary marker)
    add(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));

    // Object numbering:
    //   1 = Catalog
    //   2 = Pages
    //   3..N+2 = Page objects
    //   N+3.. = Image XObjects,  then each content stream
    //   (we interleave: for each page i, image = 3+N+i, content = 3+2N+i)
    const N = jpegPages.length;

    const objCatalog   = 1;
    const objPages     = 2;
    const pageObjBase  = 3;
    const imageObjBase = 3 + N;
    const contentBase  = 3 + 2 * N;

    // Precompute page dimensions (fit to A4)
    const A4_LONG  = 841.89;
    const A4_SHORT = 595.28;

    const pageDims = jpegPages.map((jp) => {
      const long  = Math.max(jp.w, jp.h);
      const short = Math.min(jp.w, jp.h);
      let pageW, pageH;
      if (jp.w >= jp.h) {
        pageW = A4_LONG; pageH = A4_LONG * jp.h / jp.w;
      } else {
        pageW = A4_SHORT; pageH = A4_SHORT * jp.h / jp.w;
      }
      return { W: +pageW.toFixed(2), H: +pageH.toFixed(2) };
    });

    // Build objects and track byte offsets
    const offsets = {};

    function writeObj(num, body) {
      offsets[num] = size;
      add(`${num} 0 obj\n${body}\nendobj\n`);
    }

    // 1: Catalog
    writeObj(objCatalog, `<< /Type /Catalog /Pages ${objPages} 0 R >>`);

    // 2: Pages (kids = every page object)
    const kids = [];
    for (let i = 0; i < N; i++) kids.push(`${pageObjBase + i} 0 R`);
    writeObj(objPages, `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${N} >>`);

    // 3..3+N-1: Page objects
    for (let i = 0; i < N; i++) {
      const imgNum = imageObjBase + i;
      const cNum   = contentBase + i;
      const { W, H } = pageDims[i];
      writeObj(
        pageObjBase + i,
        `<< /Type /Page /Parent ${objPages} 0 R /MediaBox [0 0 ${W} ${H}] `
        + `/Resources << /XObject << /Im0 ${imgNum} 0 R >> >> /Contents ${cNum} 0 R >>`
      );
    }

    // Image XObjects
    for (let i = 0; i < N; i++) {
      const jp = jpegPages[i];
      const num = imageObjBase + i;
      offsets[num] = size;
      add(`${num} 0 obj\n`);
      add(`<< /Type /XObject /Subtype /Image /Width ${jp.w} /Height ${jp.h} `
        + `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jp.bytes.length} >>\n`);
      add('stream\n');
      add(jp.bytes);
      add('\nendstream\nendobj\n');
    }

    // Content streams (one per page: draws the image full-bleed to the page)
    for (let i = 0; i < N; i++) {
      const { W, H } = pageDims[i];
      const content = `q\n${W} 0 0 ${H} 0 0 cm\n/Im0 Do\nQ\n`;
      const cb = enc.encode(content);
      const num = contentBase + i;
      offsets[num] = size;
      add(`${num} 0 obj\n`);
      add(`<< /Length ${cb.length} >>\nstream\n`);
      add(cb);
      add('\nendstream\nendobj\n');
    }

    // xref table
    const xrefPos = size;
    const totalObjects = 2 + 2 * N + 1;   // 0 + catalog + pages + N pages + N images + N contents
    // Actually count: 0 (free) + 1 catalog + 1 pages + N page + N image + N content = 3 + 3N
    const count = 3 + 3 * N;

    let xref = `xref\n0 ${count}\n`;
    xref += '0000000000 65535 f \n';
    for (let i = 1; i < count; i++) {
      const off = offsets[i] || 0;
      xref += String(off).padStart(10, '0') + ' 00000 n \n';
    }
    add(xref);

    // Trailer
    add(`trailer\n<< /Size ${count} /Root ${objCatalog} 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`);

    return new Blob(parts, { type: 'application/pdf' });
  }

  /* ============================================================
     Layout
     ============================================================ */
  const mq = window.matchMedia(TWO_PAGE_MQ);

  function applyLayout() {
    let twoPage;
    if (state.layoutMode === 'two') twoPage = true;
    else if (state.layoutMode === 'one') twoPage = false;
    else twoPage = mq.matches;

    if (pages.length < 2) twoPage = false;

    if (state.currentPage >= pages.length) state.currentPage = pages.length - 1;
    if (state.currentPage < 0) state.currentPage = 0;

    state.twoPage = twoPage;
    document.body.classList.toggle('two-page', twoPage);

    let visible;
    if (twoPage) {
      const spread = Math.floor(state.currentPage / 2);
      const a = spread * 2;
      const b = a + 1;
      visible = (b < pages.length) ? [a, b] : [a];
    } else {
      visible = [state.currentPage];
    }
    state.visiblePages = visible;

    pages.forEach((pg, i) => {
      const isVisible = visible.includes(i);
      pg.wrap.classList.toggle('visible', isVisible);
      pg.wrap.classList.toggle('spread-left',  twoPage && isVisible && i === visible[0] && visible.length === 2);
      pg.wrap.classList.toggle('spread-right', twoPage && isVisible && i === visible[1] && visible.length === 2);
    });

    updatePager();
    updateLayoutBtn();
    updateExportNote();

    requestAnimationFrame(() => pages.forEach(resizePage));
  }

  function updateLayoutBtn() {
    layoutBtn.dataset.mode = state.layoutMode;
    layoutLbl.textContent =
      state.layoutMode === 'one' ? '1 page' :
      state.layoutMode === 'two' ? '2 pages' :
      'Auto';
    layoutBtn.title =
      state.layoutMode === 'auto'
        ? 'Layout: Auto — tap to cycle (Auto → 1 page → 2 pages)'
        : `Layout: forced ${state.layoutMode === 'one' ? 'one page' : 'two pages'} — tap to cycle`;
  }

  layoutBtn.addEventListener('click', () => {
    const modes = ['auto', 'one', 'two'];
    const i = modes.indexOf(state.layoutMode);
    state.layoutMode = modes[(i + 1) % 3];
    applyLayout();
    scheduleSave();
  });

  function updateExportNote() {
    const vis = getExportPages();
    if (vis.length > 1) {
      exportNote.textContent = `Current view: pages ${vis[0] + 1}–${vis[vis.length - 1] + 1}.`;
    } else {
      exportNote.textContent = `Current view: page ${vis[0] + 1}.`;
    }
  }

  if (mq.addEventListener) mq.addEventListener('change', () => {
    if (state.layoutMode === 'auto') applyLayout();
  });
  else mq.addListener(() => {
    if (state.layoutMode === 'auto') applyLayout();
  });

  if (window.visualViewport) {
    let vvTimer = null;
    window.visualViewport.addEventListener('resize', () => {
      clearTimeout(vvTimer);
      vvTimer = setTimeout(() => {
        if (state.layoutMode === 'auto') applyLayout();
        else pages.forEach(resizePage);
      }, 120);
    });
  }

  /* ============================================================
     Pager
     ============================================================ */
  function updatePager() {
    const n = pages.length;
    const cur = state.currentPage;

    if (state.twoPage) {
      const spread = Math.floor(cur / 2);
      const a = spread * 2;
      const b = a + 1;
      pageLabel.textContent = (b < n)
        ? `${a + 1}–${b + 1} / ${n}`
        : `${a + 1} / ${n}`;
      prevBtn.disabled = spread === 0;
      nextBtn.disabled = (spread + 1) * 2 >= n;
    } else {
      pageLabel.textContent = `${cur + 1} / ${n}`;
      prevBtn.disabled = cur === 0;
      nextBtn.disabled = cur === n - 1;
    }
    delBtn.disabled = n <= 1;
  }

  function afterNav() {
    state.selectedIndex = -1;
    applyLayout();
    drawAllOverlays();
    scheduleSave();
  }

  prevBtn.addEventListener('click', () => {
    if (state.twoPage) {
      const spread = Math.floor(state.currentPage / 2);
      if (spread > 0) state.currentPage = (spread - 1) * 2;
    } else if (state.currentPage > 0) {
      state.currentPage--;
    }
    afterNav();
  });

  nextBtn.addEventListener('click', () => {
    if (state.twoPage) {
      const spread = Math.floor(state.currentPage / 2);
      if ((spread + 1) * 2 < pages.length) state.currentPage = (spread + 1) * 2;
    } else if (state.currentPage < pages.length - 1) {
      state.currentPage++;
    }
    afterNav();
  });

  addBtn.addEventListener('click', () => {
    const n = state.twoPage ? 2 : 1;
    for (let i = 0; i < n; i++) addPage(false);

    if (state.twoPage) {
      state.currentPage = pages.length - n;
      if (state.currentPage % 2 !== 0) state.currentPage -= 1;
    } else {
      state.currentPage = pages.length - 1;
    }

    applyLayout();
    drawAllOverlays();
    scheduleSave();
  });

  delBtn.addEventListener('click', () => {
    if (pages.length <= 1) return;

    const targets = state.twoPage ? state.visiblePages.slice().reverse() : [state.currentPage];
    const label = targets.length > 1
      ? `pages ${Math.min(...targets) + 1}–${Math.max(...targets) + 1}`
      : `page ${targets[0] + 1}`;

    if (pages.length - targets.length < 1) {
      alert('You need at least one page.');
      return;
    }

    if (!confirm(`Delete ${label}? Everything on ${targets.length > 1 ? 'them' : 'it'} will be lost.`)) return;

    for (const t of targets) deletePage(t);

    if (state.currentPage >= pages.length) state.currentPage = pages.length - 1;
    applyLayout();
    drawAllOverlays();
    scheduleSave();
  });

  /* ============================================================
     Keyboard shortcuts
     ============================================================ */
  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' && e.target.type === 'color') return;

    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();

    if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedIndex >= 0) {
      e.preventDefault();
      state.strokes.splice(state.selectedIndex, 1);
      state.selectedIndex = -1;
      redrawAll(); drawAllOverlays();
      updateHistoryButtons(); updateHints();
      scheduleSave();
      return;
    }

    if (e.key === 'Escape' && state.selectedIndex >= 0) {
      state.selectedIndex = -1;
      drawAllOverlays();
      return;
    }

    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && k === 'y') { e.preventDefault(); redo(); }
    else if (mod && k === 's') { e.preventDefault(); exportFile('png'); }
    else if (!mod && !e.altKey) {
      if (k === 'p') setTool('pen');
      else if (k === 'h') setTool('highlighter');
      else if (k === 'e') setTool('eraser');
      else if (k === 'i') { e.preventDefault(); fileIn.click(); }
      else if (k === 'l') { e.preventDefault(); layoutBtn.click(); }
      else if (k === 'arrowleft')  { animateTurn('prev'); prevBtn.click(); }
      else if (k === 'arrowright') { animateTurn('next'); nextBtn.click(); }
    }
  });

  /* ============================================================
     Boot
     ============================================================ */
  async function boot() {
    db = await openDB();
    const saved = await loadDoc();

    const imageLoads = [];

    if (saved && Array.isArray(saved.strokes)) {
      for (const s of saved.strokes) {
        if (s.kind === 'image' && s.src) {
          const promise = new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
              state.strokes.push({
                kind: 'image',
                page: s.page,
                img,
                src: s.src,
                x: s.x, y: s.y, w: s.w, h: s.h,
                aspect: s.aspect || (img.naturalWidth / img.naturalHeight)
              });
              resolve();
            };
            img.onerror = () => resolve();
            img.src = s.src;
          });
          imageLoads.push(promise);
        } else {
          state.strokes.push(s);
        }
      }
    }

    const wanted = (saved && saved.pageCount) ? Math.max(2, saved.pageCount) : 2;

    for (let i = 0; i < wanted; i++) addPage(false);

    state.currentPage = (saved && Number.isInteger(saved.currentPage))
      ? Math.min(saved.currentPage, pages.length - 1)
      : 0;

    if (saved && saved.layoutMode) state.layoutMode = saved.layoutMode;

    state.loaded = true;
    applyLayout();
    updateHistoryButtons();
    updateHints();

    redrawAll();
    drawAllOverlays();

    Promise.all(imageLoads).then(() => {
      redrawAll();
      drawAllOverlays();
    });

    requestAnimationFrame(() => pages.forEach(resizePage));
  }

  boot();

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      if (state.layoutMode === 'auto') applyLayout();
      else pages.forEach(resizePage);
    }, 250);
  });

  /* ============================================================
     PWA — service worker + install prompt
     ============================================================ */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }

  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.style.display = 'flex';
  });

  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (_) {}
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });
  }

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    if (installBtn) installBtn.style.display = 'none';
  });
})();
</script>
