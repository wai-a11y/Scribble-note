<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scribble Notepad — Foldable</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scribble">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%230a0f1a'/%3E%3Crect x='80' y='72' width='352' height='368' rx='20' fill='%23f3dfb4'/%3E%3Cpath d='M130 300 Q 170 230 210 300 T 290 300 T 370 250' fill='none' stroke='%232b1a0e' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #1b2740 0%, #0a0f1a 60%) fixed;
    color:#e6edf7;
    display:flex;flex-direction:column;height:100%;
    overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  .toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;
    background:rgba(17,24,39,.85);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.08);
    z-index:10;
  }
  .group{display:flex;align-items:center;gap:6px}
  .spacer{flex:1 1 auto}
  .divider{width:1px;height:24px;background:rgba(255,255,255,.12);margin:0 4px}

  button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
  .tool,.icon{
    width:38px;height:38px;display:grid;place-items:center;
    border-radius:10px;color:#aebbd0;
    transition:background .15s,color .15s,transform .1s;
  }
  .tool:hover,.icon:hover{background:rgba(255,255,255,.08);color:#fff}
  .tool:active,.icon:active{transform:scale(.94)}
  .tool.active{background:#2563eb;color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.45)}
  .icon:disabled{opacity:.3;cursor:not-allowed;background:transparent}
  svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .notebook-title{
    font-size:12px;color:#8b9bb4;
    max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;padding:0 6px;line-height:34px;height:34px;
    border-radius:8px;
    transition:background .15s,color .15s;
  }
  .notebook-title:hover{color:#e6edf7;background:rgba(255,255,255,.06)}

  .layout-btn{
    height:34px;padding:0 10px;border-radius:8px;
    background:rgba(255,255,255,.08);
    color:#aebbd0;font-size:11.5px;font-weight:600;
    display:flex;align-items:center;gap:6px;
    letter-spacing:.3px;white-space:nowrap;
    transition:background .15s,color .15s;
  }
  .layout-btn:hover{background:rgba(255,255,255,.14);color:#fff}
  .layout-btn .dot{width:8px;height:8px;border-radius:50%;background:#8b9bb4}
  .layout-btn[data-mode="one"],
  .layout-btn[data-mode="two"]{background:rgba(37,99,235,.20);color:#93c5fd}
  .layout-btn[data-mode="one"] .dot{background:#60a5fa}
  .layout-btn[data-mode="two"] .dot{background:#60a5fd;box-shadow:0 0 0 3px rgba(96,165,250,.25)}

  #installBtn{background:rgba(34,197,94,.15);color:#86efac;display:none}
  #installBtn:hover{background:rgba(34,197,94,.25);color:#bbf7d0}
  #installBtn .dot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}

  .colors{gap:5px}
  .swatch{
    width:24px;height:24px;border-radius:50%;
    background:var(--c);
    border:2px solid rgba(255,255,255,.22);
    padding:0;
    transition:transform .12s,border-color .12s;
  }
  .swatch:hover{transform:scale(1.12)}
  .swatch.active{border-color:#fff;box-shadow:0 0 0 2px rgba(37,99,235,.85)}
  .swatch.custom{
    background:conic-gradient(#ef4444,#f59e0b,#22c55e,#06b6d4,#3b82f6,#a855f7,#ef4444);
    position:relative;overflow:hidden;
  }
  .swatch.custom input{position:absolute;inset:-10px;opacity:0;cursor:pointer;width:200%;height:200%}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:96px;height:4px;border-radius:99px;
    background:rgba(255,255,255,.18);outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:#fff;border:0;cursor:pointer;
  }
  .sizeLabel{
    font-variant-numeric:tabular-nums;font-size:12px;color:#8b9bb4;
    min-width:22px;text-align:center;
  }

  .menu{position:relative}
  .primary{
    display:flex;align-items:center;gap:7px;
    background:linear-gradient(180deg,#3b82f6,#2563eb);
    color:#fff;padding:9px 14px;border-radius:10px;
    font-weight:600;font-size:14px;
    box-shadow:0 6px 18px rgba(37,99,235,.35);
    transition:filter .15s,transform .1s;
  }
  .primary:hover{filter:brightness(1.09)}
  .primary:active{transform:scale(.97)}
  .primary svg{width:15px;height:15px}
  .dropdown{
    position:absolute;right:0;top:calc(100% + 8px);
    background:#111827;border:1px solid rgba(255,255,255,.1);
    border-radius:12px;padding:6px;min-width:280px;
    box-shadow:0 20px 40px rgba(0,0,0,.55);
    display:none;flex-direction:column;gap:2px;z-index:50;
  }
  .dropdown.open{display:flex}
  .dropdown button{
    text-align:left;padding:9px 10px;border-radius:8px;
    font-size:14px;color:#dbe4f3;display:flex;align-items:center;gap:9px;width:100%;
  }
  .dropdown button:hover{background:rgba(255,255,255,.08)}
  .dropdown svg{width:16px;height:16px;color:#7f93ad;flex-shrink:0}
  .check{
    display:flex;align-items:center;gap:9px;padding:10px;
    font-size:13px;color:#9fb0c9;cursor:pointer;
    border-top:1px solid rgba(255,255,255,.08);margin-top:4px;
  }
  .check input{accent-color:#2563eb;width:15px;height:15px;cursor:pointer}
  .note{
    font-size:11.5px;color:#6b7c95;padding:6px 10px 4px;
    border-top:1px solid rgba(255,255,255,.08);margin-top:4px;line-height:1.4;
  }

  .stage{
    flex:1;min-height:0;
    display:flex;justify-content:center;
    padding:16px 16px 82px;
    position:relative;
    overflow:hidden;
  }
  body.two-page .stage{padding:12px 12px 78px}

  .book{
    flex:1 1 auto;
    min-width:0;min-height:0;
    max-width:1400px;
    display:flex;
    gap:18px;
    will-change:transform,opacity;
  }
  .book.turn-next{ animation:turnNext .38s cubic-bezier(.4,0,.2,1); }
  .book.turn-prev{ animation:turnPrev .38s cubic-bezier(.4,0,.2,1); }
  @keyframes turnNext{
    0%{transform:translateX(0);opacity:1}
    45%{transform:translateX(-40px);opacity:.35}
    55%{transform:translateX(40px);opacity:.35}
    100%{transform:translateX(0);opacity:1}
  }
  @keyframes turnPrev{
    0%{transform:translateX(0);opacity:1}
    45%{transform:translateX(40px);opacity:.35}
    55%{transform:translateX(-40px);opacity:.35}
    100%{transform:translateX(0);opacity:1}
  }
  .book.dragging{transition:none;animation:none}

  .page-wrap{
    flex:1 1 0;
    min-width:0;min-height:0;
    display:none;
  }
  .page-wrap.visible{display:flex}

  .paper{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    padding:24px;
    border-radius:12px;
    background-color:#f2ddb0;
    background-image:
      radial-gradient(circle at 18% 28%, rgba(180,140,80,.16), transparent 42%),
      radial-gradient(circle at 76% 66%, rgba(160,120,60,.13), transparent 46%),
      radial-gradient(circle at 46% 88%, rgba(200,170,110,.14), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(200,170,110,.12), transparent 38%),
      url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.10'/></svg>"),
      linear-gradient(180deg,#f8ebcd 0%,#f3dfb4 55%,#ecd39c 100%);
    box-shadow:
      0 24px 70px rgba(0,0,0,.55),
      0 0 0 1px rgba(120,80,30,.25),
      inset 0 0 60px rgba(140,100,40,.20),
      inset 0 0 14px rgba(120,80,30,.14);
    overflow:hidden;
  }
  body.two-page .page-wrap.spread-left  .paper{
    border-top-right-radius:3px;border-bottom-right-radius:3px;
  }
  body.two-page .page-wrap.spread-right .paper{
    border-top-left-radius:3px;border-bottom-left-radius:3px;
  }

  body.two-page .book{gap:10px}
  body.two-page .paper{padding:16px}
  @media (max-width: 700px){
    body.two-page .stage{padding:8px 8px 76px}
    body.two-page .book{gap:6px}
    body.two-page .paper{padding:10px;border-radius:8px}
  }

  .sheet{
    position:relative;
    flex:1 1 auto;min-width:0;
    border-radius:4px;
    background-image:repeating-linear-gradient(
      to bottom,
      rgba(150,110,55,.30) 0 1px,
      transparent 1px 32px
    );
  }
  .board,.overlay{
    position:absolute;inset:0;
    width:100%;height:100%;
    display:block;
  }
  .board{touch-action:none;cursor:crosshair;z-index:1}
  .overlay{pointer-events:none;z-index:2}

  .text-layer{
    position:absolute;inset:0;
    z-index:5;
    pointer-events:none;
  }
  body.text-mode .board,
  body.text-mode .overlay{cursor:text}

  .text-item{
    position:absolute;
    min-width:24px;
    min-height:1.4em;
    padding:2px 4px;
    border:1px dashed transparent;
    border-radius:4px;
    outline:none;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.05;
    caret-color:#2563eb;
    cursor:text;
    user-select:text;
    -webkit-user-select:text;
    pointer-events:auto;
    font-size:16px;
  }
  .text-item:hover{ border-color:rgba(37,99,235,.35); }
  .text-item:focus{
    border-color:#2563eb;
    background:rgba(37,99,235,.06);
  }

  .pagenum{
    position:absolute;
    right:14px;bottom:10px;
    z-index:3;
    font-size:12px;
    font-variant-numeric:tabular-nums;
    letter-spacing:.5px;
    color:rgba(120,85,40,.55);
    pointer-events:none;
    user-select:none;
  }

  .hint{
    position:absolute;inset:0;z-index:0;
    display:grid;place-items:center;
    color:rgba(140,100,50,.45);font-size:15px;letter-spacing:.3px;
    pointer-events:none;transition:opacity .35s;
    text-align:center;padding:0 20px;
  }
  .hint.hide{opacity:0}
  .hint small{display:block;font-size:12px;margin-top:6px;opacity:.7}
  .hint .cursive{
    display:block;
    font-family:"Snell Roundhand","Bradley Hand","Brush Script MT","Segoe Script","Lucida Handwriting","Apple Chancery",cursive;
    font-size:30px;
    color:rgba(120,85,40,.6);
    margin-bottom:8px;
    letter-spacing:.5px;
    transform:translateX(-10px);
  }

  .pager{
    position:fixed;
    bottom:12px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:4px;
    padding:5px 6px;
    background:rgba(17,24,39,.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:999px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    z-index:20;
  }
  .pager button{
    width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;color:#cbd6e6;
    transition:background .15s,color .15s;
  }
  .pager button:hover{background:rgba(255,255,255,.1)}
  .pager button:disabled{opacity:.3;cursor:not-allowed;background:transparent}
  .pager .label{
    font-size:13px;font-variant-numeric:tabular-nums;
    color:#cbd6e6;min-width:70px;text-align:center;padding:0 4px;
  }
  .pager .sep{width:1px;height:22px;background:rgba(255,255,255,.12);margin:0 3px}
  .pager #addPage{color:#86efac}
  .pager #addPage:hover{background:rgba(34,197,94,.18)}
  .pager #delPage{color:#fca5a5}
  .pager #delPage:hover{background:rgba(239,68,68,.18)}

  .saving{
    position:fixed;
    top:8px;left:50%;transform:translateX(-50%);
    padding:5px 12px;border-radius:999px;
    background:rgba(37,99,235,.92);
    color:#fff;font-size:11.5px;font-weight:600;
    letter-spacing:.3px;z-index:60;
    opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .saving.show{opacity:1}

  .busy{
    position:fixed;inset:0;
    display:none;place-items:center;
    background:rgba(10,15,26,.75);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    z-index:80;
  }
  .busy.show{display:grid}
  .busy .box{
    padding:16px 22px;border-radius:12px;
    background:rgba(17,24,39,.95);
    border:1px solid rgba(255,255,255,.12);
    text-align:center;font-size:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
  }
  .busy .spinner{
    width:26px;height:26px;margin:0 auto 10px;
    border:3px solid rgba(255,255,255,.18);
    border-top-color:#60a5fa;border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to { transform:rotate(360deg); } }

  .toast{
    position:fixed;
    bottom:76px;left:50%;transform:translateX(-50%) translateY(20px);
    padding:10px 16px;border-radius:10px;
    background:rgba(17,24,39,.96);
    color:#e6edf7;font-size:13px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 20px 50px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:70;
    max-width:80vw;text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .sidebar-backdrop{
    position:fixed;inset:0;
    background:rgba(0,0,0,.55);
    opacity:0;pointer-events:none;
    transition:opacity .2s;
    z-index:30;
  }
  body.sidebar-open .sidebar-backdrop{
    opacity:1;pointer-events:auto;
  }

  .sidebar{
    position:fixed;
    top:0;left:0;bottom:0;
    width:min(320px,85vw);
    background:#0f1622;
    border-right:1px solid rgba(255,255,255,.08);
    transform:translateX(-100%);
    transition:transform .25s cubic-bezier(.4,0,.2,1);
    z-index:40;
    display:flex;flex-direction:column;
    overflow:hidden;
    box-shadow:4px 0 30px rgba(0,0,0,.5);
  }
  body.sidebar-open .sidebar{transform:translateX(0)}

  .sidebar-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 16px 12px;
    border-bottom:1px solid rgba(255,255,255,.08);
    gap:8px;
  }
  .sidebar-header h2{
    font-size:15px;font-weight:600;margin:0;color:#e6edf7;
  }
  .sidebar-new{
    display:flex;align-items:center;gap:5px;
    padding:6px 10px;border-radius:8px;
    background:rgba(37,99,235,.2);
    color:#93c5fd;font-size:12px;font-weight:600;
    transition:background .15s;
  }
  .sidebar-new:hover{background:rgba(37,99,235,.35)}
  .sidebar-new svg{width:14px;height:14px}

  .sidebar-list{
    flex:1;min-height:0;
    overflow-y:auto;
    list-style:none;padding:8px;margin:0;
  }
  .sidebar-empty{
    padding:24px 16px;
    color:#6b7c95;font-size:12.5px;
    text-align:center;line-height:1.5;
  }
  .sidebar-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 10px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s;
    margin-bottom:2px;
  }
  .sidebar-item:hover{background:rgba(255,255,255,.05)}
  .sidebar-item.active{background:rgba(37,99,235,.18)}
  .sidebar-item-icon{
    width:28px;height:28px;
    display:grid;place-items:center;
    color:#7f93ad;
    flex-shrink:0;
  }
  .sidebar-item.active .sidebar-item-icon{color:#93c5fd}
  .sidebar-item-icon svg{width:18px;height:18px}
  .sidebar-item-main{flex:1;min-width:0}
  .sidebar-item-title{
    font-size:13.5px;color:#e6edf7;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sidebar-item.active .sidebar-item-title{color:#93c5fd}
  .sidebar-item-meta{
    font-size:11px;color:#6b7c95;margin-top:2px;
  }
  .sidebar-item-actions{
    display:flex;gap:2px;
    opacity:0;transition:opacity .15s;
  }
  .sidebar-item:hover .sidebar-item-actions,
  .sidebar-item.active .sidebar-item-actions{opacity:1}
  .sidebar-item-actions button{
    width:26px;height:26px;border-radius:6px;
    display:grid;place-items:center;
    color:#8b9bb4;
  }
  .sidebar-item-actions button svg{width:14px;height:14px}
  .sidebar-item-actions button:hover{
    background:rgba(255,255,255,.1);color:#e6edf7;
  }
  .sidebar-item-actions .del:hover{
    background:rgba(239,68,68,.2);color:#fca5a5;
  }

  @media (max-width:640px){
    .toolbar{gap:6px;padding:8px 10px}
    .tool,.icon{width:34px;height:34px}
    input[type=range]{width:70px}
    .stage{padding:10px 10px 78px}
    .paper{padding:14px;border-radius:10px}
    .divider{display:none}
    .book{gap:10px}
    .layout-btn{padding:0 8px;font-size:11px}
    .pager{bottom:8px;gap:2px;padding:4px 5px}
    .pager button{width:32px;height:32px}
    .pager .label{min-width:62px;font-size:12px}
    .notebook-title{max-width:90px;font-size:11px}
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="group" role="group" aria-label="Notebooks">
    <button class="icon" id="sidebarBtn" title="Notebooks (N)" aria-label="Open notebooks">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="notebook-title" id="notebookTitle" title="Open notebooks"></span>
  </div>

  <div class="divider"></div>

  <div class="group" role="group" aria-label="Drawing tools">
    <button class="tool active" data-tool="pen" title="Pen (P)" aria-label="Pen">
      <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
    </button>
    <button class="tool" data-tool="highlighter" title="Highlighter (H)" aria-label="Highlighter">
      <svg viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
    </button>
    <button class="tool" data-tool="eraser" title="Eraser (E)" aria-label="Eraser">
      <svg viewBox="0 0 24 24"><path d="M20 20H8.5L3.7 15.2a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l5.5 5.5a2 2 0 0 1 0 2.8L11.5 20"/><path d="M7 12l5 5"/></svg>
    </button>
    <button class="tool" data-tool="text" title="Text (T) — tap page then type" aria-label="Text">
      <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
    </button>
  </div>

  <div class="divider"></div>

  <div class="group">
    <button class="icon" id="insertImg" title="Insert image (I)" aria-label="Insert image">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div class="divider"></div>

  <div class="group colors" id="colors" role="group" aria-label="Colors">

<input type="file" id="importInput" accept=".json,application/json" hidden>

<div class="pager">

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const book       = document.getElementById('book');
  const stage      = document.getElementById('stage');
  const sizeEl     = document.getElementById('size');
  const sizeLbl    = document.getElementById('sizeLabel');
  const undoBtn    = document.getElementById('undo');
  const redoBtn    = document.getElementById('redo');
  const menu       = document.getElementById('menu');
  const dropdown   = document.getElementById('dropdown');
  const saveBtn    = document.getElementById('saveBtn');
  const linesCb    = document.getElementById('withLines');
  const numbersCb  = document.getElementById('withNumbers');
  const askCb      = document.getElementById('askLocation');
  const fileIn     = document.getElementById('fileInput');
  const importIn   = document.getElementById('importInput');
  const exportNote = document.getElementById('exportNote');
  const prevBtn    = document.getElementById('prevPage');
  const nextBtn    = document.getElementById('nextPage');
  const addBtn     = document.getElementById('addPage');
  const delBtn     = document.getElementById('delPage');
  const pageLabel  = document.getElementById('pageLabel');
  const layoutBtn  = document.getElementById('layoutBtn');
  const layoutLbl  = document.getElementById('layoutLabel');
  const savingBadge= document.getElementById('savingBadge');
  const busy       = document.getElementById('busy');
  const busyText   = document.getElementById('busyText');
  const toastEl    = document.getElementById('toast');
  const notebookTitleEl = document.getElementById('notebookTitle');
  const sidebarList = document.getElementById('sidebarList');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');

  const RULED       = 32;
  const HANDLE_SIZE = 11;
  const HANDLE_HIT  = 14;
  const MIN_SIDE    = 30;
  const TWO_PAGE_MQ = '(min-width: 560px)';
  const SWIPE_MIN   = 60;
  const SWIPE_MAX_Y = 70;

  const toolSizes = { pen: 3, highlighter: 18, eraser: 24 };
  let textSize = 3;

  const supportsSavePicker = typeof window.showSaveFilePicker === 'function';

  const state = {
    tool: 'pen',
    color: '#2b1a0e',
    size: 3,
    strokes: [],
    texts: [],
    redo: [],
    current: null,
    selectedIndex: -1,
    selectedTextId: null,
    dragMode: null,
    dragStart: null,
    currentPage: 0,
    visiblePages: [0],
    twoPage: false,
    layoutMode: 'auto',
    loaded: false,
    loading: false,
    notebookId: null,
    notebookTitle: ''
  };

  const pages = [];

  let toastTimer = null;
  function showToast(msg, ms = 2400) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  /* ============================================================
     IndexedDB
     ============================================================ */
  const DB_NAME = 'scribble-notepad';
  const DB_VERSION = 2;
  const STORE_DOC = 'doc';
  const STORE_NOTEBOOKS = 'notebooks';
  const STORE_META = 'meta';

  let db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return resolve(null);
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains(STORE_DOC)) d.createObjectStore(STORE_DOC);
        if (!d.objectStoreNames.contains(STORE_NOTEBOOKS)) d.createObjectStore(STORE_NOTEBOOKS);
        if (!d.objectStoreNames.contains(STORE_META)) d.createObjectStore(STORE_META);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function txGet(store, key) {
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, 'readonly');
      const req = t.objectStore(store).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function txPut(store, key, value) {
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, 'readwrite');
      t.objectStore(store).put(value, key);
      t.oncomplete = resolve;
      t.onerror = () => reject(t.error);
    });
  }

  function txDelete(store, key) {
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, 'readwrite');
      t.objectStore(store).delete(key);
      t.oncomplete = resolve;
      t.onerror = () => reject(t.error);
    });
  }

  function txGetAll(store) {
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, 'readonly');
      const req = t.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  function serializeStrokes() {
    const out = [];
    for (const s of state.strokes) {
      if (s.kind === 'image') {
        out.push({
          kind: 'image',
          page: s.page,
          x: s.x, y: s.y, w: s.w, h: s.h,
          aspect: s.aspect,
          src: s.src || ''
        });
      } else {
        out.push({
          kind: 'stroke',
          page: s.page,
          tool: s.tool,
          color: s.color,
          size: s.size,
          points: s.points
        });
      }
    }
    return out;
  }

  function serializeTexts() {
    return state.texts.map(t => ({
      kind: 'text',
      page: t.page,
      x: t.x, y: t.y,
      text: t.text,
      color: t.color,
      size: t.size,
      font: t.font
    }));
  }

  function buildDoc() {
    return {
      version: 3,
      pageCount: pages.length,
      currentPage: state.currentPage,
      layoutMode: state.layoutMode,
      textSize: textSize,
      strokes: serializeStrokes(),
      texts: serializeTexts()
    };
  }

  async function saveCurrentNotebook() {
    if (!db || !state.notebookId || state.loading || !state.loaded) return;
    try {
      const doc = buildDoc();
      const now = Date.now();

      await txPut(STORE_NOTEBOOKS, state.notebookId, { doc, updatedAt: now });

      const meta = (await txGet(STORE_META, state.notebookId)) || {
        id: state.notebookId,
        createdAt: now
      };
      meta.title = state.notebookTitle || 'Untitled';
      meta.pageCount = pages.length;
      meta.updatedAt = now;
      await txPut(STORE_META, state.notebookId, meta);

      flashSaved();
    } catch (err) {
      if (err && err.name === 'QuotaExceededError') {
        showToast('Storage full — delete some notebooks.');
      } else {
        console.warn('Save failed:', err);
      }
    }
  }

  async function loadNotebook(id) {
    if (!db) return false;
    if (state.loading) return false;

    state.loading = true;
    clearTimeout(saveTimer);

    try {
      const record = await txGet(STORE_NOTEBOOKS, id);
      if (!record) {
        state.loading = false;
        return false;
      }

      const doc = record.doc || {};
      const meta = (await txGet(STORE_META, id)) || {};

      state.notebookId = id;
      state.notebookTitle = meta.title || 'Untitled';
      state.strokes = [];
      state.texts = [];
      state.redo = [];
      state.current = null;
      state.dragMode = null;
      state.dragStart = null;
      state.selectedIndex = -1;
      state.selectedTextId = null;

      const imageLoads = [];
      if (Array.isArray(doc.strokes)) {
        for (const s of doc.strokes) {
          if (s.kind === 'image' && s.src) {
            imageLoads.push(new Promise((resolve) => {
              const img = new Image();
              img.onload = () => {
                state.strokes.push({
                  kind: 'image',
                  page: s.page,
                  img,
                  src: s.src,
                  x: s.x, y: s.y, w: s.w, h: s.h,
                  aspect: s.aspect || (img.naturalWidth / img.naturalHeight)
                });
                resolve();
              };
              img.onerror = () => resolve();
              img.src = s.src;
            }));
          } else {
            state.strokes.push(s);
          }
        }
      }

      if (Array.isArray(doc.texts)) {
        state.texts = doc.texts.filter(t => t && typeof t.text === 'string');
      }

      if (Number.isFinite(doc.textSize)) textSize = doc.textSize;
      if (doc.layoutMode) state.layoutMode = doc.layoutMode;

      for (const pg of pages) {
        ro.unobserve(pg.sheet);
        pg.wrap.remove();
      }
      pages.length = 0;

      const wanted = Math.max(2, doc.pageCount || 2);
      for (let i = 0; i < wanted; i++) addPage(false);

      state.currentPage = Number.isInteger(doc.currentPage)
        ? Math.min(doc.currentPage, pages.length - 1)
        : 0;

      rebuildTextLayers();
      applyLayout();
      updateHistoryButtons();
      updateHints();
      redrawAll();
      drawAllOverlays();

      await Promise.all(imageLoads);
      redrawAll();
      drawAllOverlays();

      requestAnimationFrame(() => pages.forEach(resizePage));

      state.loaded = true;
      return true;
    } catch (err) {
      console.warn('Load failed:', err);
      return false;
    } finally {
      state.loading = false;
    }
  }

  async function createNotebook(title) {
    if (!db) return null;

    if (state.notebookId && state.loaded) {
      await saveCurrentNotebook();
    }

    const id = 'nb-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    const now = Date.now();

    const doc = {
      version: 3,
      pageCount: 2,
      currentPage: 0,
      layoutMode: 'auto',
      textSize: textSize,
      strokes: [],
      texts: []
    };

    await txPut(STORE_NOTEBOOKS, id, { doc, updatedAt: now });
    await txPut(STORE_META, id, {
      id,
      title: title || 'Untitled',
      createdAt: now,
      updatedAt: now,
      pageCount: 2
    });

    await loadNotebook(id);
    try { localStorage.setItem('scribble:lastNotebook', id); } catch (_) {}
    return id;
  }

  async function renameNotebook(id, newTitle) {
    if (!db) return;
    const meta = await txGet(STORE_META, id);
    if (!meta) return;
    meta.title = newTitle;
    meta.updatedAt = Date.now();
    await txPut(STORE_META, id, meta);
    if (state.notebookId === id) {
      state.notebookTitle = newTitle;
      updateNotebookTitleUI();
    }
  }

  async function deleteNotebookById(id) {
    if (!db) return false;
    const all = await txGetAll(STORE_META);
    if (all.length <= 1) return false;

    await txDelete(STORE_NOTEBOOKS, id);
    await txDelete(STORE_META, id);

    if (state.notebookId === id) {
      const remaining = all.filter(m => m.id !== id)
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      await loadNotebook(remaining[0].id);
      try { localStorage.setItem('scribble:lastNotebook', remaining[0].id); } catch (_) {}
      updateNotebookTitleUI();
    }
    return true;
  }

  async function switchNotebook(id) {
    if (!db || id === state.notebookId) return;
    await saveCurrentNotebook();
    await loadNotebook(id);
    try { localStorage.setItem('scribble:lastNotebook', id); } catch (_) {}
    updateNotebookTitleUI();
    await renderSidebarList();
    closeSidebar();
  }

  let saveTimer = null;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCurrentNotebook, 500);
  }

  let badgeTimer = null;
  function flashSaved() {
    if (!savingBadge) return;
    savingBadge.textContent = 'Saved';
    savingBadge.classList.add('show');
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(() => savingBadge.classList.remove('show'), 900);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) saveCurrentNotebook();
  });
  window.addEventListener('pagehide', () => saveCurrentNotebook());
  window.addEventListener('beforeunload', () => { if (db) saveCurrentNotebook(); });

  /* ============================================================
     ResizeObserver
     ============================================================ */
  const ro = new ResizeObserver((entries) => {
    for (const entry of entries) {
      const pg = entry.target.__pg;
      if (pg) resizePage(pg);
    }
  });

  /* ============================================================
     Page creation
     ============================================================ */
  function makePage() {
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap';

    const paper = document.createElement('div');
    paper.className = 'paper';

    const sheet = document.createElement('div');
    sheet.className = 'sheet';

    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.innerHTML =
      '<span class="cursive">Wai says</span>' +
      'Start scribbling…' +
      '<small>Drag &amp; drop or paste an image anywhere</small>';

    const board = document.createElement('canvas');
    board.className = 'board';

    const overlay = document.createElement('canvas');
    overlay.className = 'overlay';

    const textLayer = document.createElement('div');
    textLayer.className = 'text-layer';

    const num = document.createElement('div');
    num.className = 'pagenum';

    sheet.append(hint, board, overlay, textLayer, num);
    paper.append(sheet);
    wrap.append(paper);

    const pg = {
      index: pages.length,
      wrap, sheet, board, overlay, textLayer, hint, num,
      ctx: board.getContext('2d'),
      octx: overlay.getContext('2d'),
      dpr: 1
    };

    sheet.__pg = pg;

    board.addEventListener('pointerdown', (e) => onDown(e, pg));
    board.addEventListener('pointermove', (e) => onMove(e, pg));
    board.addEventListener('contextmenu', (e) => e.preventDefault());

    ro.observe(sheet);
    return pg;
  }

  function addPage(navigate = true) {
    const pg = makePage();
    pages.push(pg);
    book.appendChild(pg.wrap);
    renumberPages();

    if (navigate) state.currentPage = pg.index;
    applyLayout();
    scheduleSave();
    return pg;
  }

  function deletePage(index) {
    if (pages.length <= 1) return;
    const pg = pages[index];
    if (!pg) return;

    ro.unobserve(pg.sheet);
    pg.wrap.remove();
    pages.splice(index, 1);

    state.strokes = state.strokes.filter(s => s.page !== index);
    for (const s of state.strokes) if (s.page > index) s.page -= 1;

    state.texts = state.texts.filter(t => t.page !== index);
    for (const t of state.texts) if (t.page > index) t.page -= 1;

    state.redo = [];
    state.current = null;

    renumberPages();

    if (state.currentPage >= pages.length) state.currentPage = pages.length - 1;
    if (state.selectedIndex >= state.strokes.length) state.selectedIndex = -1;

    rebuildTextLayers();
    applyLayout();
    redrawAll();
    drawAllOverlays();
    updateHints();
    updateHistoryButtons();
    scheduleSave();
  }

  function renumberPages() {
    pages.forEach((pg, i) => {
      pg.index = i;
      pg.num.textContent = i + 1;
    });
  }

  function resizePage(pg) {
    const r = pg.sheet.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width));
    const h = Math.max(1, Math.round(r.height));
    if (w <= 2 || h <= 2) return;

    pg.dpr = Math.min(window.devicePixelRatio || 1, 2);
    pg.board.width   = Math.round(w * pg.dpr);
    pg.board.height  = Math.round(h * pg.dpr);
    pg.overlay.width = pg.board.width;
    pg.overlay.height= pg.board.height;

    redrawPage(pg);
    drawOverlay(pg);
  }

  function redrawPage(pg) {
    const ctx = pg.ctx, dpr = pg.dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = pg.board.width / dpr;
    const h = pg.board.height / dpr;
    ctx.clearRect(-2, -2, w + 4, h + 4);

    for (const s of state.strokes) {
      if (s.page !== pg.index) continue;
      if (s.kind === 'image') {
        try { ctx.drawImage(s.img, s.x, s.y, s.w, s.h); } catch (_) {}
      } else {
        drawStroke(ctx, s);
      }
    }
    if (state.current && state.current.page === pg.index) {
      drawStroke(ctx, state.current);
    }
  }

  function redrawAll() { pages.forEach(redrawPage); }

  function applyStyle(ctx, s) {
    ctx.globalCompositeOperation = s.tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.globalAlpha = s.tool === 'highlighter' ? 0.32 : 1;
    ctx.strokeStyle = s.color;
    ctx.fillStyle   = s.color;
    ctx.lineWidth   = s.size;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
  }

  function drawStroke(ctx, s) {
    const p = s.points;
    if (!p.length) return;
    ctx.save();
    applyStyle(ctx, s);

    if (p.length === 1) {
      ctx.beginPath();
      ctx.arc(p[0].x, p[0].y, Math.max(s.size / 2, 0.5), 0, Math.PI * 2);
      ctx.fill();
    } else {
      let prev = p[0], prevMid = p[0];
      for (let i = 1; i < p.length; i++) {
        const cur = p[i];
        const mx = (prev.x + cur.x) / 2;
        const my = (prev.y + cur.y) / 2;
        ctx.beginPath();
        ctx.moveTo(prevMid.x, prevMid.y);
        ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
        ctx.stroke();
        prev = cur;
        prevMid = { x: mx, y: my };
      }
      ctx.beginPath();
      ctx.moveTo(prevMid.x, prevMid.y);
      ctx.lineTo(prev.x, prev.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLiveTail(ctx, s) {
    const p = s.points;
    const i = p.length - 1;
    const prev = p[i - 1], cur = p[i];
    const prevMid = i >= 2
      ? { x: (p[i - 2].x + p[i - 1].x) / 2, y: (p[i - 2].y + p[i - 1].y) / 2 }
      : p[0];
    const mx = (prev.x + cur.x) / 2;
    const my = (prev.y + cur.y) / 2;

    ctx.save();
    applyStyle(ctx, s);
    ctx.beginPath();
    ctx.moveTo(prevMid.x, prevMid.y);
    ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
    ctx.stroke();
    ctx.restore();
  }

  function textFontSize(t) {
    return Math.max(12, t.size * 5);
  }

  function autosizeTextarea(el) {
    if (!el) return;
    el.style.height = 'auto';
    let fontPx = 16;
    try {
      const fs = parseFloat(getComputedStyle(el).fontSize);
      if (isFinite(fs) && fs > 0) fontPx = fs;
    } catch (_) {}
    const minH = Math.round(fontPx * 1.4);
    const h = Math.max(el.scrollHeight || 0, minH);
    el.style.height = h + 'px';
  }

  function reflowAllText() {
    document.querySelectorAll('.text-item').forEach(autosizeTextarea);
  }

  function buildTextElement(t) {
    const el = document.createElement('textarea');
    el.className = 'text-item';
    el.spellcheck = false;
    el.rows = 1;
    el.value = t.text;
    el.dataset.textId = String(t.id);

    el.style.left = t.x + 'px';
    el.style.top  = t.y + 'px';
    el.style.color = t.color;
    el.style.fontSize = textFontSize(t) + 'px';
    el.style.fontFamily = t.font;
    el.style.background = 'transparent';
    el.style.border = '1px dashed transparent';
    el.style.resize = 'none';
    el.style.overflow = 'hidden';
    el.style.whiteSpace = 'pre-wrap';
    el.style.outline = 'none';

    const autosize = () => autosizeTextarea(el);
    const initialWidth = Math.max(120, Math.min(420, Math.round((t.text || ' ').length * textFontSize(t) * 0.6) + 40));
    el.style.width = initialWidth + 'px';

    el.addEventListener('focus', () => {
      state.selectedTextId = t.id;
      sizeEl.value = textSize;
      sizeLbl.textContent = textSize;
      requestAnimationFrame(autosize);
    });

    el.addEventListener('blur', () => {
      const newText = el.value.replace(/\n+$/, '');
      if (!newText.trim()) {
        removeText(t.id, true);
      } else {
        t.text = newText;
        t.x = parseFloat(el.style.left) || t.x;
        t.y = parseFloat(el.style.top)  || t.y;
        scheduleSave();
      }
      state.selectedTextId = null;
    });

    el.addEventListener('input', () => {
      t.text = el.value;
      autosize();
      scheduleSave();
    });

    el.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { el.blur(); }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        el.blur();
      }
    });

    el.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
    el.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: true });

    requestAnimationFrame(autosize);
    return el;
  }

  function rebuildTextLayers() {
    for (const pg of pages) pg.textLayer.innerHTML = '';

    for (let i = 0; i < state.texts.length; i++) {
      if (state.texts[i].id == null) state.texts[i].id = i + 1;
    }

    for (const t of state.texts) {
      const pg = pages[t.page];
      if (!pg) continue;
      pg.textLayer.appendChild(buildTextElement(t));
    }

    requestAnimationFrame(reflowAllText);
  }

  function addTextAt(pageIndex, x, y) {
    const id = (state.texts.reduce((m, t) => Math.max(m, t.id || 0), 0) || 0) + 1;
    const t = {
      kind: 'text',
      id,
      page: pageIndex,
      x, y,
      text: '',
      color: state.color,
      size: textSize,
      font: 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
    };
    state.texts.push(t);

    const pg = pages[pageIndex];
    if (!pg) return t;

    const el = buildTextElement(t);
    pg.textLayer.appendChild(el);
    pg.hint.classList.add('hide');

    el.focus({ preventScroll: true });
    if (document.activeElement !== el) {
      requestAnimationFrame(() => {
        try { el.focus({ preventScroll: true }); } catch (_) {}
      });
    }

    scheduleSave();
    return t;
  }

  function removeText(id, save = true) {
    state.texts = state.texts.filter(t => t.id !== id);
    rebuildTextLayers();
    if (save) scheduleSave();
  }

  function getHandles(s) {
    return {
      nw: { x: s.x,        y: s.y },
      ne: { x: s.x + s.w,  y: s.y },
      sw: { x: s.x,        y: s.y + s.h },
      se: { x: s.x + s.w,  y: s.y + s.h }
    };
  }

  function drawOverlay(pg) {
    const octx = pg.octx, dpr = pg.dpr;
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = pg.board.width / dpr;
    const h = pg.board.height / dpr;
    octx.clearRect(-2, -2, w + 4, h + 4);

    const s = state.selectedIndex >= 0 ? state.strokes[state.selectedIndex] : null;
    if (!s || s.kind !== 'image' || s.page !== pg.index) return;

    octx.strokeStyle = '#2563eb';
    octx.lineWidth = 1.5;
    octx.setLineDash([6, 4]);
    octx.strokeRect(s.x + 0.5, s.y + 0.5, Math.max(0, s.w - 1), Math.max(0, s.h - 1));
    octx.setLineDash([]);

    const hs = HANDLE_SIZE;
    for (const p of Object.values(getHandles(s))) {
      octx.fillStyle = '#ffffff';
      octx.strokeStyle = '#2563eb';
      octx.lineWidth = 2;
      octx.beginPath();
      octx.rect(p.x - hs / 2, p.y - hs / 2, hs, hs);
      octx.fill();
      octx.stroke();
    }
  }

  function drawAllOverlays() { pages.forEach(drawOverlay); }

  function pointFrom(e, pg) {
    const r = pg.board.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function hitTestHandles(p, pg) {
    if (state.selectedIndex < 0) return null;
    const s = state.strokes[state.selectedIndex];
    if (!s || s.kind !== 'image' || s.page !== pg.index) return null;

    for (const [name, hp] of Object.entries(getHandles(s))) {
      if (Math.hypot(p.x - hp.x, p.y - hp.y) <= HANDLE_HIT) {
        return { handle: name, element: s };
      }
    }
    return null;
  }

  function hitTestImages(p, pageIndex) {
    for (let i = state.strokes.length - 1; i >= 0; i--) {
      const s = state.strokes[i];
      if (s.kind !== 'image' || s.page !== pageIndex) continue;
      if (p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h) {
        return { element: s, index: i };
      }
    }
    return null;
  }

  function onDown(e, pg) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();

    if (state.currentPage !== pg.index) {
      state.currentPage = pg.index;
      updatePager();
      updateExportNote();
      scheduleSave();
    }

    const p = pointFrom(e, pg);

    if (state.tool === 'text') {
      if (state.selectedIndex >= 0) {
        state.selectedIndex = -1;
        drawAllOverlays();
      }
      addTextAt(pg.index, Math.max(0, p.x - 8), Math.max(0, p.y - 10));
      return;
    }

    try { pg.board.setPointerCapture(e.pointerId); } catch (_) {}

    const handleHit = hitTestHandles(p, pg);
    if (handleHit) { startResize(handleHit.handle, handleHit.element, p); return; }

    const imgHit = hitTestImages(p, pg.index);
    if (imgHit) {
      if (state.selectedIndex !== imgHit.index) {
        state.selectedIndex = imgHit.index;
        drawAllOverlays();
      }
      startMove(imgHit.element, p);
      return;
    }

    if (state.selectedIndex >= 0) {
      state.selectedIndex = -1;
      drawAllOverlays();
    }

    state.redo.length = 0;
    updateHistoryButtons();

    state.current = {
      kind: 'stroke',
      page: pg.index,
      tool: state.tool,
      color: state.color,
      size: state.size,
      points: [p]
    };
    drawStroke(pg.ctx, state.current);
    pg.hint.classList.add('hide');
  }

  function onMove(e, pg) {
    const p = pointFrom(e, pg);

    if (!state.current && !state.dragMode) {
      if (e.pointerType === 'mouse') updateCursor(p, pg);
      return;
    }

    if (state.current && state.current.page !== pg.index) return;
    if (state.dragMode && state.selectedIndex >= 0) {
      const sel = state.strokes[state.selectedIndex];
      if (sel && sel.page !== pg.index) return;
    }

    e.preventDefault();

    if (state.dragMode) { handleDrag(p); return; }

    const s = state.current;
    if (!s) return;

    const raw = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : [];
    const events = raw.length ? raw : [e];

    for (const ev of events) {
      const pt = pointFrom(ev, pg);
      const last = s.points[s.points.length - 1];
      const dx = pt.x - last.x, dy = pt.y - last.y;
      if (dx * dx + dy * dy < 1) continue;
      s.points.push(pt);
      drawLiveTail(pg.ctx, s);
    }
  }

  function updateCursor(p, pg) {
    if (state.tool === 'text') { pg.board.style.cursor = 'text'; return; }
    const sel = state.selectedIndex >= 0 ? state.strokes[state.selectedIndex] : null;
    if (sel && sel.kind === 'image' && sel.page === pg.index) {
      for (const [name, hp] of Object.entries(getHandles(sel))) {
        if (Math.hypot(p.x - hp.x, p.y - hp.y) <= HANDLE_HIT) {
          pg.board.style.cursor =
            (name === 'nw' || name === 'se') ? 'nwse-resize' : 'nesw-resize';
          return;
        }
      }
    }
    pg.board.style.cursor = hitTestImages(p, pg.index) ? 'move'
                          : (state.tool === 'eraser' ? 'cell' : 'crosshair');
  }

  function finishAny() {
    if (state.dragMode) {
      state.dragMode = null;
      state.dragStart = null;
      scheduleSave();
      return;
    }
    if (!state.current) return;

    const pg = pages[state.current.page];
    state.strokes.push(state.current);
    state.current = null;

    if (pg) redrawPage(pg);
    drawAllOverlays();
    updateHistoryButtons();
    updateHints();
    scheduleSave();
  }

  window.addEventListener('pointerup', finishAny);
  window.addEventListener('pointercancel', finishAny);

  function startMove(s, p) {
    state.dragMode = 'move';
    state.dragStart = { x: s.x, y: s.y, px: p.x, py: p.y };
  }

  function startResize(handle, s, p) {
    let ax, ay;
    if (handle === 'se')      { ax = s.x;       ay = s.y; }
    else if (handle === 'sw') { ax = s.x + s.w; ay = s.y; }
    else if (handle === 'ne') { ax = s.x;       ay = s.y + s.h; }
    else                      { ax = s.x + s.w; ay = s.y + s.h; }

    state.dragMode = 'resize-' + handle;
    state.dragStart = { w: s.w, h: s.h, anchorX: ax, anchorY: ay, aspect: s.aspect };
  }

  function handleDrag(p) {
    const s = state.strokes[state.selectedIndex];
    if (!s || s.kind !== 'image') return;

    if (state.dragMode === 'move') {
      s.x = state.dragStart.x + (p.x - state.dragStart.px);
      s.y = state.dragStart.y + (p.y - state.dragStart.py);
    } else {
      applyResize(s, state.dragMode.slice(7), p);
    }
    const pg = pages[s.page];
    if (pg) { redrawPage(pg); drawOverlay(pg); }
  }

  function applyResize(s, handle, p) {
    const ds = state.dragStart;
    const sx = (handle === 'ne' || handle === 'se') ? 1 : -1;
    const sy = (handle === 'sw' || handle === 'se') ? 1 : -1;

    const dx = sx * ds.aspect, dy = sy;
    const len = Math.hypot(dx, dy);
    const dirX = dx / len, dirY = dy / len;

    const proj = (p.x - ds.anchorX) * dirX + (p.y - ds.anchorY) * dirY;
    const origDiag = Math.hypot(ds.w, ds.h);

    let scale = proj / origDiag;
    const minScale = Math.max(MIN_SIDE / ds.w, MIN_SIDE / ds.h);
    if (!isFinite(scale) || scale < minScale) scale = minScale;

    const newW = ds.w * scale, newH = ds.h * scale;

    if (handle === 'se')      { s.x = ds.anchorX;        s.y = ds.anchorY; }
    else if (handle === 'sw') { s.x = ds.anchorX - newW; s.y = ds.anchorY; }
    else if (handle === 'ne') { s.x = ds.anchorX;        s.y = ds.anchorY - newH; }
    else                      { s.x = ds.anchorX - newW; s.y = ds.anchorY - newH; }

    s.w = newW; s.h = newH;
  }

  function updateHistoryButtons() {
    undoBtn.disabled = state.strokes.length === 0 && state.texts.length === 0;
    redoBtn.disabled = state.redo.length === 0;
  }

  function updateHints() {
    for (const pg of pages) {
      const hasStroke = state.strokes.some(s => s.page === pg.index);
      const hasText   = state.texts.some(t => t.page === pg.index);
      pg.hint.classList.toggle('hide', hasStroke || hasText);
    }
  }

  function undo() {
    if (!state.strokes.length) return;
    state.redo.push(state.strokes.pop());
    state.selectedIndex = -1;
    redrawAll(); drawAllOverlays();
    updateHistoryButtons(); updateHints();
    scheduleSave();
  }

  function redo() {
    if (!state.redo.length) return;
    state.strokes.push(state.redo.pop());
    state.selectedIndex = -1;
    redrawAll(); drawAllOverlays();
    updateHistoryButtons(); updateHints();
    scheduleSave();
  }

  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  document.getElementById('clear').addEventListener('click', () => {
    const targets = state.twoPage ? state.visiblePages.slice() : [state.currentPage];
    const has = state.strokes.some(s => targets.includes(s.page))
             || state.texts.some(t => targets.includes(t.page));
    if (!has) return;

    const label = targets.length > 1
      ? `pages ${targets[0] + 1}–${targets[targets.length - 1] + 1}`
      : `page ${targets[0] + 1}`;

    if (!confirm(`Clear ${label}? This cannot be undone.`)) return;

    state.strokes = state.strokes.filter(s => !targets.includes(s.page));
    state.texts   = state.texts.filter(t => !targets.includes(t.page));
    state.redo = [];
    state.current = null;
    state.selectedIndex = -1;
    rebuildTextLayers();
    redrawAll(); drawAllOverlays();
    updateHistoryButtons(); updateHints();
    scheduleSave();
  });

  function setTool(t) {
    if (t === state.tool) return;
    toolSizes[state.tool] = state.size;
    state.tool = t;

    if (t === 'text') {
      sizeEl.value = textSize;
      sizeLbl.textContent = textSize;
    } else {
      state.size = toolSizes[t] || 3;
      sizeEl.value = state.size;
      sizeLbl.textContent = state.size;
    }

    document.querySelectorAll('.tool').forEach(b =>
      b.classList.toggle('active', b.dataset.tool === t));

    document.body.classList.toggle('text-mode', t === 'text');

    pages.forEach(pg => {
      pg.board.style.cursor =
        t === 'text' ? 'text' :
        t === 'eraser' ? 'cell' : 'crosshair';
    });

    if (t !== 'text' && document.activeElement && document.activeElement.classList.contains('text-item')) {
      document.activeElement.blur();
    }
  }

  document.querySelectorAll('.tool').forEach(btn => {
    btn.addEventListener('click', () => setTool(btn.dataset.tool));
  });

  sizeEl.addEventListener('input', () => {
    const val = +sizeEl.value;
    sizeLbl.textContent = val;

    if (state.selectedTextId != null) {
      const t = state.texts.find(x => x.id === state.selectedTextId);
      if (t) {
        t.size = val;
        textSize = val;
        const el = document.querySelector(`.text-item[data-text-id="${t.id}"]`);
        if (el) {
          el.style.fontSize = textFontSize(t) + 'px';
          autosizeTextarea(el);
        }
        scheduleSave();
      }
      return;
    }

    state.size = val;
    toolSizes[state.tool] = state.size;
  });

  function setColor(c) {
    state.color = c;
    document.querySelectorAll('.swatch[data-color]').forEach(s =>
      s.classList.toggle('active', s.dataset.color.toLowerCase() === c.toLowerCase()));
    if (state.tool === 'eraser') setTool('pen');

    if (state.selectedTextId != null) {
      const t = state.texts.find(x => x.id === state.selectedTextId);
      if (t) {
        t.color = c;
        const el = document.querySelector(`.text-item[data-text-id="${t.id}"]`);
        if (el) el.style.color = c;
        scheduleSave();
      }
    }
  }

  document.querySelectorAll('.swatch[data-color]').forEach(sw => {
    sw.addEventListener('click', () => setColor(sw.dataset.color));
  });

  document.getElementById('customColor').addEventListener('input', (e) => {
    state.color = e.target.value;
    document.querySelectorAll('.swatch[data-color]').forEach(s => s.classList.remove('active'));
    document.querySelector('.swatch.custom').classList.add('active');
    if (state.tool === 'eraser') setTool('pen');
  });

  document.getElementById('insertImg').addEventListener('click', () => fileIn.click());

  fileIn.addEventListener('change', () => {
    const f = fileIn.files && fileIn.files[0];
    if (f) loadImageFile(f);
    fileIn.value = '';
  });

  function loadImageFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const img = new Image();
      img.onload = () => insertImage(img, dataUrl);
      img.onerror = () => alert('Could not load that image.');
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  }

  function insertImage(img, dataUrl) {
    const pg = pages[state.currentPage];
    if (!pg) return;

    const sheetW = pg.board.width / pg.dpr;
    const sheetH = pg.board.height / pg.dpr;
    if (sheetW <= 2 || sheetH <= 2) return;

    let w = img.naturalWidth || img.width || 300;
    let h = img.naturalHeight || img.height || 300;

    const maxW = sheetW * 0.6, maxH = sheetH * 0.6;
    const scale = Math.min(1, maxW / w, maxH / h);
    w *= scale; h *= scale;

    const element = {
      kind: 'image',
      page: pg.index,
      img,
      src: dataUrl,
      x: (sheetW - w) / 2,
      y: (sheetH - h) / 2,
      w, h,
      aspect: (img.naturalWidth || w) / (img.naturalHeight || h)
    };

    state.strokes.push(element);
    state.redo.length = 0;
    state.selectedIndex = state.strokes.length - 1;

    redrawPage(pg); drawAllOverlays();
    updateHistoryButtons(); updateHints();
    scheduleSave();
  }

  ['dragenter', 'dragover'].forEach(evt => {
    document.addEventListener(evt, (e) => {
      if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      }
    });
  });

  document.addEventListener('drop', (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) {
      e.preventDefault();
      loadImageFile(f);
    }
  });

  document.addEventListener('paste', (e) => {
    if (!e.clipboardData) return;
    if (document.activeElement && document.activeElement.classList.contains('text-item')) return;
    const item = Array.from(e.clipboardData.items || [])
      .find(it => it.type && it.type.startsWith('image/'));
    if (item) {
      e.preventDefault();
      const f = item.getAsFile();
      if (f) loadImageFile(f);
    }
  });

  const swipe = {
    active: false, startX: 0, startY: 0, dx: 0, dy: 0,
    pointerId: null, startTime: 0
  };

  stage.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    if (state.current || state.dragMode) return;
    if (state.tool === 'text') return;
    if (e.target && e.target.classList && e.target.classList.contains('text-item')) return;
    swipe.active = true;
    swipe.pointerId = e.pointerId;
    swipe.startX = e.clientX;
    swipe.startY = e.clientY;
    swipe.dx = 0; swipe.dy = 0;
    swipe.startTime = Date.now();
    book.classList.add('dragging');
    book.style.transform = '';
  }, { passive: true });

  stage.addEventListener('pointermove', (e) => {
    if (!swipe.active || e.pointerId !== swipe.pointerId) return;
    swipe.dx = e.clientX - swipe.startX;
    swipe.dy = e.clientY - swipe.startY;

    if (state.current) {
      swipe.active = false;
      book.classList.remove('dragging');
      book.style.transform = '';
      return;
    }

    if (Math.abs(swipe.dy) > SWIPE_MAX_Y && Math.abs(swipe.dx) < SWIPE_MIN) return;

    const capped = Math.max(-90, Math.min(90, swipe.dx * 0.45));
    book.style.transform = `translateX(${capped}px)`;
  }, { passive: true });

  function endSwipe(e) {
    if (!swipe.active) return;
    if (e && swipe.pointerId !== null && e.pointerId !== swipe.pointerId) return;

    const dx = swipe.dx, dy = swipe.dy;
    const dt = Date.now() - swipe.startTime;
    const velocity = Math.abs(dx) / Math.max(1, dt);

    swipe.active = false;
    swipe.pointerId = null;
    book.classList.remove('dragging');
    book.style.transform = '';

    const horizontal = Math.abs(dx) > Math.abs(dy);
    const distanceOK = Math.abs(dx) > SWIPE_MIN;
    const velocityOK = velocity > 0.35 && Math.abs(dx) > 25;
    const verticalOK = Math.abs(dy) < SWIPE_MAX_Y;

    if (!horizontal || !verticalOK || (!distanceOK && !velocityOK)) return;

    if (dx < 0) {
      if (!nextBtn.disabled) { animateTurn('next'); nextBtn.click(); }
    } else {
      if (!prevBtn.disabled) { animateTurn('prev'); prevBtn.click(); }
    }
  }

  stage.addEventListener('pointerup', endSwipe);
  stage.addEventListener('pointercancel', endSwipe);
  stage.addEventListener('pointerleave', (e) => {
    if (swipe.active) endSwipe(e);
  });

  function animateTurn(direction) {
    book.classList.remove('turn-next', 'turn-prev');
    void book.offsetWidth;
    book.classList.add(direction === 'next' ? 'turn-next' : 'turn-prev');
    setTimeout(() => {
      book.classList.remove('turn-next', 'turn-prev');
    }, 420);
  }
