  async function saveBlob(blob, filename, mimeHint) {
    const usePicker = askCb.checked && supportsSavePicker;

    if (usePicker) {
      try {
        const ext = filename.split('.').pop();
        const types = [{
          description: ext.toUpperCase() + ' file',
          accept: { [mimeHint || blob.type || 'application/octet-stream']: ['.' + ext] }
        }];
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        showToast('Saved to ' + handle.name);
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        console.warn('Save picker failed, falling back to download:', err);
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast('Downloaded ' + filename);
  }

  function addNoise(c, W, H) {
    const TS = 140;
    const tile = document.createElement('canvas');
    tile.width = tile.height = TS;
    const tc = tile.getContext('2d');
    const img = tc.createImageData(TS, TS);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = 118 + Math.random() * 40;
      d[i] = v + 8; d[i + 1] = v; d[i + 2] = v - 12; d[i + 3] = 26;
    }
    tc.putImageData(img, 0, 0);
    const pat = c.createPattern(tile, 'repeat');
    c.save();
    c.fillStyle = pat;
    c.fillRect(0, 0, W, H);
    c.restore();
  }

  function paintParchment(c, W, H, scale, withLines, hCss) {
    const base = c.createLinearGradient(0, 0, 0, H);
    base.addColorStop(0,    '#f8ebcd');
    base.addColorStop(0.55, '#f3dfb4');
    base.addColorStop(1,    '#ecd39c');
    c.fillStyle = base;
    c.fillRect(0, 0, W, H);

    const R = Math.max(W, H);
    const blotch = (rx, ry, rad, rgb, a) => {
      const x = W * rx, y = H * ry, r = R * rad;
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${rgb},${a})`);
      g.addColorStop(1, `rgba(${rgb},0)`);
      c.fillStyle = g;
      c.fillRect(x - r, y - r, r * 2, r * 2);
    };
    blotch(0.18, 0.28, 0.42, '180,140,80', 0.16);
    blotch(0.76, 0.66, 0.46, '160,120,60', 0.13);
    blotch(0.46, 0.88, 0.42, '200,170,110', 0.14);
    blotch(0.88, 0.12, 0.38, '200,170,110', 0.12);

    const vg = c.createRadialGradient(
      W / 2, H / 2, Math.min(W, H) * 0.35,
      W / 2, H / 2, Math.max(W, H) * 0.75
    );
    vg.addColorStop(0, 'rgba(120,80,30,0)');
    vg.addColorStop(1, 'rgba(120,80,30,0.14)');
    c.fillStyle = vg;
    c.fillRect(0, 0, W, H);

    addNoise(c, W, H);

    if (withLines) {
      c.fillStyle = 'rgba(150,110,55,0.30)';
      const t = Math.max(1, Math.round(scale));
      for (let y = 0; y < hCss; y += RULED) {
        c.fillRect(0, Math.round(y * scale), W, t);
      }
    }
  }

  function drawPageNumber(c, W, H, scale, n) {
    const size = Math.max(11, Math.round(13 * scale));
    c.save();
    c.font = `${size}px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    c.fillStyle = 'rgba(120,85,40,0.55)';
    c.textAlign = 'right';
    c.textBaseline = 'bottom';
    c.fillText(String(n), W - 16 * scale, H - 10 * scale);
    c.restore();
  }

  function drawTextsForPage(c, pageIndex, scale) {
    for (const t of state.texts) {
      if (t.page !== pageIndex) continue;
      const fontSize = textFontSize(t) * scale;
      c.save();
      c.font = `${fontSize}px ${t.font}`;
      c.fillStyle = t.color;
      c.textBaseline = 'top';
      const lines = String(t.text).split('\n');
      const lineHeight = fontSize * 1.05;
      lines.forEach((line, i) => {
        c.fillText(line, t.x * scale, t.y * scale + i * lineHeight);
      });
      c.restore();
    }
  }

  function renderPageToJPEG(pi, withLines, withNumbers, scale) {
    const pg = pages[pi];
    if (!pg) return null;

    const wCss = pg.board.width / pg.dpr;
    const hCss = pg.board.height / pg.dpr;

    const out = document.createElement('canvas');
    out.width  = Math.round(wCss * scale);
    out.height = Math.round(hCss * scale);
    const c = out.getContext('2d');

    paintParchment(c, out.width, out.height, scale, withLines, hCss);
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = 'high';
    c.drawImage(pg.board, 0, 0, out.width, out.height);

    drawTextsForPage(c, pi, scale);

    if (withNumbers) drawPageNumber(c, out.width, out.height, scale, pi + 1);

    const dataUrl = out.toDataURL('image/jpeg', 0.92);
    const jpegBytes = base64ToBytes(dataUrl.split(',')[1]);
    return { bytes: jpegBytes, w: out.width, h: out.height };
  }

  function compose(pageList, withLines, withNumbers, scale) {
    const pg0  = pages[pageList[0]];
    const wCss = pg0.board.width / pg0.dpr;
    const hCss = pg0.board.height / pg0.dpr;

    const gapCss = pageList.length > 1 ? 20 : 0;
    const outWCss = pageList.length * wCss + gapCss * (pageList.length - 1);

    const out = document.createElement('canvas');
    out.width  = Math.round(outWCss * scale);
    out.height = Math.round(hCss * scale);
    const c = out.getContext('2d');

    c.fillStyle = '#0a0f1a';
    c.fillRect(0, 0, out.width, out.height);

    pageList.forEach((pi, k) => {
      const pg = pages[pi];
      if (!pg) return;

      const W = wCss * scale, H = hCss * scale;
      const offX = (wCss + gapCss) * k;

      c.save();
      c.translate(offX * scale, 0);

      paintParchment(c, W, H, scale, withLines, hCss);
      c.imageSmoothingEnabled = true;
      c.imageSmoothingQuality = 'high';
      c.drawImage(pg.board, 0, 0, W, H);

      drawTextsForPage(c, pi, scale);

      if (withNumbers) drawPageNumber(c, W, H, scale, pi + 1);
      c.restore();
    });

    return out;
  }

  function timestamp() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }

  function getExportPages() {
    return state.twoPage ? state.visiblePages.slice() : [state.currentPage];
  }

  async function exportFile(type) {
    state.selectedIndex = -1;
    drawAllOverlays();

    const withLines   = linesCb.checked;
    const withNumbers = numbersCb.checked;
    const base = (state.notebookTitle || 'note').replace(/[^\w\-]+/g, '_') + '-' + timestamp();

    /* ---------- Backup: this notebook ---------- */
    if (type === 'json') {
      const doc = buildDoc();
      const payload = {
        type: 'scribble-notebook',
        formatVersion: 1,
        title: state.notebookTitle || 'Untitled',
        exportedAt: new Date().toISOString(),
        doc
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      await saveBlob(blob, base + '.json', 'application/json');
      return;
    }

    /* ---------- Backup: ALL notebooks ---------- */
    if (type === 'json-all') {
      busyText.textContent = 'Bundling notebooks…';
      busy.classList.add('show');
      await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));

      try {
        const metas = await txGetAll(STORE_META);
        const bundle = {
          type: 'scribble-bundle',
          formatVersion: 1,
          exportedAt: new Date().toISOString(),
          notebooks: []
        };

        for (const meta of metas) {
          const rec = await txGet(STORE_NOTEBOOKS, meta.id);
          if (!rec || !rec.doc) continue;
          bundle.notebooks.push({
            title: meta.title || 'Untitled',
            createdAt: meta.createdAt || Date.now(),
            updatedAt: meta.updatedAt || Date.now(),
            doc: rec.doc
          });
        }

        const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
        await saveBlob(blob, 'scribble-backup-' + timestamp() + '.json', 'application/json');
      } catch (err) {
        console.warn(err);
        alert('Backup failed: ' + err.message);
      } finally {
        busy.classList.remove('show');
      }
      return;
    }

    /* ---------- Import from JSON ---------- */
    if (type === 'import') {
      importIn.click();
      return;
    }

    /* ---------- Text ---------- */
    if (type === 'txt') {
      let out = '';
      for (let i = 0; i < pages.length; i++) {
        const pageTexts = state.texts
          .filter(t => t.page === i)
          .sort((a, b) => (a.y - b.y) || (a.x - b.x));
        out += `Page ${i + 1}\n`;
        out += '─'.repeat(40) + '\n';
        out += (pageTexts.length ? pageTexts.map(t => t.text).join('\n') : '(empty)') + '\n\n';
      }
      const blob = new Blob([out], { type: 'text/plain;charset=utf-8' });
      await saveBlob(blob, base + '.txt', 'text/plain');
      return;
    }

    /* ---------- PDF: all pages ---------- */
    if (type === 'pdf-all') {
      busyText.textContent = 'Building PDF…';
      busy.classList.add('show');

      await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));

      try {
        const scale = 2;
        const jpegPages = [];
        for (let i = 0; i < pages.length; i++) {
          const j = renderPageToJPEG(i, withLines, withNumbers, scale);
          if (j) jpegPages.push(j);
        }
        const blob = buildMultiPagePDF(jpegPages);
        await saveBlob(blob, base + '-all.pdf', 'application/pdf');
      } catch (err) {
        console.error(err);
        alert('Could not build the PDF: ' + err.message);
      } finally {
        busy.classList.remove('show');
      }
      return;
    }

    /* ---------- PNG / PDF: current view ---------- */
    const pageList = getExportPages().filter(i => pages[i]);
    if (!pageList.length) return;
    const out = compose(pageList, withLines, withNumbers, 2);

    if (type === 'png') {
      await new Promise((resolve) => {
        out.toBlob(async (blob) => {
          if (blob) await saveBlob(blob, base + '.png', 'image/png');
          resolve();
        }, 'image/png');
      });
      return;
    }

    const dataUrl = out.toDataURL('image/jpeg', 0.92);
    const bytes = base64ToBytes(dataUrl.split(',')[1]);
    const blob = buildMultiPagePDF([{ bytes, w: out.width, h: out.height }]);
    await saveBlob(blob, base + '.pdf', 'application/pdf');
  }

  function base64ToBytes(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  function buildMultiPagePDF(jpegPages) {
    if (!jpegPages || !jpegPages.length) throw new Error('No pages to export.');

    const enc = new TextEncoder();
    const parts = [];
    let size = 0;
    const add = (d) => {
      const b = (d instanceof Uint8Array) ? d : enc.encode(d);
      parts.push(b); size += b.length;
    };

    add(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));

    const N = jpegPages.length;
    const objCatalog = 1, objPages = 2;
    const pageObjBase = 3, imageObjBase = 3 + N, contentBase = 3 + 2 * N;

    const A4_LONG = 841.89, A4_SHORT = 595.28;
    const pageDims = jpegPages.map((jp) => {
      let pageW, pageH;
      if (jp.w >= jp.h) { pageW = A4_LONG; pageH = A4_LONG * jp.h / jp.w; }
      else              { pageW = A4_SHORT; pageH = A4_SHORT * jp.h / jp.w; }
      return { W: +pageW.toFixed(2), H: +pageH.toFixed(2) };
    });

    const offsets = {};
    const writeObj = (num, body) => { offsets[num] = size; add(`${num} 0 obj\n${body}\nendobj\n`); };

    writeObj(objCatalog, `<< /Type /Catalog /Pages ${objPages} 0 R >>`);

    const kids = [];
    for (let i = 0; i < N; i++) kids.push(`${pageObjBase + i} 0 R`);
    writeObj(objPages, `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${N} >>`);

    for (let i = 0; i < N; i++) {
      const imgNum = imageObjBase + i, cNum = contentBase + i;
      const { W, H } = pageDims[i];
      writeObj(pageObjBase + i,
        `<< /Type /Page /Parent ${objPages} 0 R /MediaBox [0 0 ${W} ${H}] `
        + `/Resources << /XObject << /Im0 ${imgNum} 0 R >> >> /Contents ${cNum} 0 R >>`);
    }

    for (let i = 0; i < N; i++) {
      const jp = jpegPages[i];
      const num = imageObjBase + i;
      offsets[num] = size;
      add(`${num} 0 obj\n`);
      add(`<< /Type /XObject /Subtype /Image /Width ${jp.w} /Height ${jp.h} `
        + `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jp.bytes.length} >>\n`);
      add('stream\n');
      add(jp.bytes);
      add('\nendstream\nendobj\n');
    }

    for (let i = 0; i < N; i++) {
      const { W, H } = pageDims[i];
      const cb = enc.encode(`q\n${W} 0 0 ${H} 0 0 cm\n/Im0 Do\nQ\n`);
      const num = contentBase + i;
      offsets[num] = size;
      add(`${num} 0 obj\n`);
      add(`<< /Length ${cb.length} >>\nstream\n`);
      add(cb);
      add('\nendstream\nendobj\n');
    }

    const xrefPos = size;
    const count = 3 + 3 * N;
    let xref = `xref\n0 ${count}\n0000000000 65535 f \n`;
    for (let i = 1; i < count; i++) {
      xref += String(offsets[i] || 0).padStart(10, '0') + ' 00000 n \n';
    }
    add(xref);
    add(`trailer\n<< /Size ${count} /Root ${objCatalog} 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`);

    return new Blob(parts, { type: 'application/pdf' });
  }

  /* ============================================================
     Import from JSON file
     ============================================================ */
  importIn.addEventListener('change', async () => {
    const f = importIn.files && importIn.files[0];
    importIn.value = '';
    if (!f) return;
    await handleImportFile(f);
  });

  async function handleImportFile(file) {
    if (!file.name.toLowerCase().endsWith('.json')) {
      alert('Please choose a .json backup file.');
      return;
    }

    let text;
    try {
      text = await file.text();
    } catch (err) {
      alert('Could not read the file.');
      return;
    }

    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (err) {
      alert('Not a valid JSON file.');
      return;
    }

    // Single notebook
    if (parsed && parsed.type === 'scribble-notebook' && parsed.doc) {
      if (!confirm(`Import "${parsed.title || 'Untitled'}" as a new notebook?`)) return;
      await importOneNotebook(parsed.title || 'Untitled', parsed.doc);
      showToast('Imported "' + (parsed.title || 'Untitled') + '"');
      return;
    }

    // Bundle of notebooks
    if (parsed && parsed.type === 'scribble-bundle' && Array.isArray(parsed.notebooks)) {
      if (!parsed.notebooks.length) {
        alert('This backup is empty.');
        return;
      }
      if (!confirm(`Import ${parsed.notebooks.length} notebook(s) from this backup?`)) return;

      for (const nb of parsed.notebooks) {
        if (nb && nb.doc) {
          await importOneNotebook(nb.title || 'Imported', nb.doc);
        }
      }
      showToast(`Imported ${parsed.notebooks.length} notebook(s)`);
      return;
    }

    // Legacy / raw doc format (in case the user has an old export)
    if (parsed && Array.isArray(parsed.strokes)) {
      if (!confirm('This looks like a raw notebook export. Import as a new notebook?')) return;
      await importOneNotebook('Imported', parsed);
      showToast('Imported notebook');
      return;
    }

    alert('Unrecognized backup format.');
  }

  async function importOneNotebook(title, doc) {
    if (!db) return;

    await saveCurrentNotebook();

    const id = 'nb-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    const now = Date.now();

    await txPut(STORE_NOTEBOOKS, id, { doc, updatedAt: now });
    await txPut(STORE_META, id, {
      id,
      title: title || 'Imported',
      createdAt: now,
      updatedAt: now,
      pageCount: doc.pageCount || 2
    });

    await loadNotebook(id);
    try { localStorage.setItem('scribble:lastNotebook', id); } catch (_) {}
    updateNotebookTitleUI();
    await renderSidebarList();
  }

  /* ============================================================
     Layout
     ============================================================ */
  const mq = window.matchMedia(TWO_PAGE_MQ);

  function applyLayout() {
    let twoPage;
    if (state.layoutMode === 'two') twoPage = true;
    else if (state.layoutMode === 'one') twoPage = false;
    else twoPage = mq.matches;

    if (pages.length < 2) twoPage = false;
    if (state.currentPage >= pages.length) state.currentPage = pages.length - 1;
    if (state.currentPage < 0) state.currentPage = 0;

    state.twoPage = twoPage;
    document.body.classList.toggle('two-page', twoPage);

    let visible;
    if (twoPage) {
      const spread = Math.floor(state.currentPage / 2);
      const a = spread * 2;
      const b = a + 1;
      visible = (b < pages.length) ? [a, b] : [a];
    } else {
      visible = [state.currentPage];
    }
    state.visiblePages = visible;

    pages.forEach((pg, i) => {
      const isVisible = visible.includes(i);
      pg.wrap.classList.toggle('visible', isVisible);
      pg.wrap.classList.toggle('spread-left',  twoPage && isVisible && i === visible[0] && visible.length === 2);
      pg.wrap.classList.toggle('spread-right', twoPage && isVisible && i === visible[1] && visible.length === 2);
    });

    updatePager();
    updateLayoutBtn();
    updateExportNote();

    requestAnimationFrame(() => {
      pages.forEach(resizePage);
      reflowAllText();
    });
  }

  function updateLayoutBtn() {
    layoutBtn.dataset.mode = state.layoutMode;
    layoutLbl.textContent =
      state.layoutMode === 'one' ? '1 page' :
      state.layoutMode === 'two' ? '2 pages' :
      'Auto';
    layoutBtn.title =
      state.layoutMode === 'auto'
        ? 'Layout: Auto — tap to cycle (Auto → 1 page → 2 pages)'
        : `Layout: forced ${state.layoutMode === 'one' ? 'one page' : 'two pages'} — tap to cycle`;
  }

  layoutBtn.addEventListener('click', () => {
    const modes = ['auto', 'one', 'two'];
    const i = modes.indexOf(state.layoutMode);
    state.layoutMode = modes[(i + 1) % 3];
    applyLayout();
    scheduleSave();
  });

  function updateExportNote() {
    const vis = getExportPages();
    exportNote.textContent = (vis.length > 1)
      ? `Current view: pages ${vis[0] + 1}–${vis[vis.length - 1] + 1}.`
      : `Current view: page ${vis[0] + 1}.`;
  }

  if (mq.addEventListener) mq.addEventListener('change', () => {
    if (state.layoutMode === 'auto') applyLayout();
  });
  else mq.addListener(() => {
    if (state.layoutMode === 'auto') applyLayout();
  });

  if (window.visualViewport) {
    let vvTimer = null;
    window.visualViewport.addEventListener('resize', () => {
      clearTimeout(vvTimer);
      vvTimer = setTimeout(() => {
        if (state.layoutMode === 'auto') applyLayout();
        else pages.forEach(resizePage);
      }, 120);
    });
  }

  function updatePager() {
    const n = pages.length;
    const cur = state.currentPage;

    if (state.twoPage) {
      const spread = Math.floor(cur / 2);
      const a = spread * 2, b = a + 1;
      pageLabel.textContent = (b < n) ? `${a + 1}–${b + 1} / ${n}` : `${a + 1} / ${n}`;
      prevBtn.disabled = spread === 0;
      nextBtn.disabled = (spread + 1) * 2 >= n;
    } else {
      pageLabel.textContent = `${cur + 1} / ${n}`;
      prevBtn.disabled = cur === 0;
      nextBtn.disabled = cur === n - 1;
    }
    delBtn.disabled = n <= 1;
  }

  function afterNav() {
    state.selectedIndex = -1;
    applyLayout();
    drawAllOverlays();
    scheduleSave();
  }

  prevBtn.addEventListener('click', () => {
    if (state.twoPage) {
      const spread = Math.floor(state.currentPage / 2);
      if (spread > 0) state.currentPage = (spread - 1) * 2;
    } else if (state.currentPage > 0) state.currentPage--;
    afterNav();
  });

  nextBtn.addEventListener('click', () => {
    if (state.twoPage) {
      const spread = Math.floor(state.currentPage / 2);
      if ((spread + 1) * 2 < pages.length) state.currentPage = (spread + 1) * 2;
    } else if (state.currentPage < pages.length - 1) state.currentPage++;
    afterNav();
  });

  addBtn.addEventListener('click', () => {
    const n = state.twoPage ? 2 : 1;
    for (let i = 0; i < n; i++) addPage(false);
    if (state.twoPage) {
      state.currentPage = pages.length - n;
      if (state.currentPage % 2 !== 0) state.currentPage -= 1;
    } else {
      state.currentPage = pages.length - 1;
    }
    applyLayout();
    drawAllOverlays();
    scheduleSave();
  });

  delBtn.addEventListener('click', () => {
    if (pages.length <= 1) return;
    const targets = state.twoPage ? state.visiblePages.slice().reverse() : [state.currentPage];
    const label = targets.length > 1
      ? `pages ${Math.min(...targets) + 1}–${Math.max(...targets) + 1}`
      : `page ${targets[0] + 1}`;
    if (pages.length - targets.length < 1) { alert('You need at least one page.'); return; }
    if (!confirm(`Delete ${label}? Everything on ${targets.length > 1 ? 'them' : 'it'} will be lost.`)) return;
    for (const t of targets) deletePage(t);
    if (state.currentPage >= pages.length) state.currentPage = pages.length - 1;
    applyLayout();
    drawAllOverlays();
    scheduleSave();
  });

  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' && e.target.type === 'color') return;
    if (document.activeElement && document.activeElement.classList.contains('text-item')) return;

    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();

    if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedIndex >= 0) {
      e.preventDefault();
      state.strokes.splice(state.selectedIndex, 1);
      state.selectedIndex = -1;
      redrawAll(); drawAllOverlays();
      updateHistoryButtons(); updateHints();
      scheduleSave();
      return;
    }

    if (e.key === 'Escape' && state.selectedIndex >= 0) {
      state.selectedIndex = -1;
      drawAllOverlays();
      return;
    }

    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && k === 'y') { e.preventDefault(); redo(); }
    else if (mod && k === 's') { e.preventDefault(); exportFile('png'); }
    else if (!mod && !e.altKey) {
      if (k === 'p') setTool('pen');
      else if (k === 'h') setTool('highlighter');
      else if (k === 'e') setTool('eraser');
      else if (k === 't') { e.preventDefault(); setTool('text'); }
      else if (k === 'i') { e.preventDefault(); fileIn.click(); }
      else if (k === 'l') { e.preventDefault(); layoutBtn.click(); }
      else if (k === 'n' && !mod) { e.preventDefault(); toggleSidebar(); }
      else if (k === 'arrowleft')  { animateTurn('prev'); prevBtn.click(); }
      else if (k === 'arrowright') { animateTurn('next'); nextBtn.click(); }
    }
  });

  async function boot() {
    db = await openDB();

    const existingMeta = await txGetAll(STORE_META);
    if (existingMeta.length === 0) {
      const oldDoc = await txGet(STORE_DOC, 'main');
      if (oldDoc) {
        const id = 'nb-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        const now = Date.now();
        await txPut(STORE_NOTEBOOKS, id, { doc: oldDoc, updatedAt: now });
        await txPut(STORE_META, id, {
          id, title: 'My Notebook',
          createdAt: now, updatedAt: now,
          pageCount: oldDoc.pageCount || 2
        });
        await txDelete(STORE_DOC, 'main');
      }
    }

    let all = await txGetAll(STORE_META);

    if (all.length === 0) {
      await createNotebook('My Notebook');
    } else {
      let lastId = null;
      try { lastId = localStorage.getItem('scribble:lastNotebook'); } catch (_) {}

      let target = all.find(m => m.id === lastId);
      if (!target) {
        all.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        target = all[0];
      }
      await loadNotebook(target.id);
    }

    try {
      if (state.notebookId) localStorage.setItem('scribble:lastNotebook', state.notebookId);
    } catch (_) {}

    updateNotebookTitleUI();
    await renderSidebarList();
  }

  boot();

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      if (state.layoutMode === 'auto') applyLayout();
      else pages.forEach(resizePage);
    }, 250);
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }

  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.style.display = 'flex';
  });

  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (_) {}
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });
  }

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    if (installBtn) installBtn.style.display = 'none';
  });

  if (!supportsSavePicker) {
    askCb.disabled = true;
    askCb.parentElement.title = 'Not supported in this browser — files go to Downloads.';
  }
})();
</script>
</body>
